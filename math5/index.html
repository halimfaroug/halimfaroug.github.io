 {hi:"الأجرة = عدد الكيلومترات × أجرة الكيلومتر.",q:"أجرة كل كيلومتر في سيارة الأجرة 3 ريالات. كم أجرة 4 كيلومترات؟",t:"i",a:"12",u:"ريالًا",d:"e",h:"4 × 3 = 12 ريالًا."}]}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const LVL={e:["سهل",5],m:["متوسط",10],h:["صعب",15]};
const ALL=CHAPTERS.flatMap(c=>c.ex.map((e,i)=>Object.assign({},e,{id:c.id+"e"+i,ch:c.id})));
const TOTAL=ALL.length;
const get=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
let done=get("completedEx",{}),tokens=get("tokens",0),font=get("m5font",0);
if(typeof done!=="object"||Array.isArray(done))done={};if(typeof tokens!=="number")tokens=0;
function save(){try{localStorage.setItem("completedEx",JSON.stringify(done));localStorage.setItem("tokens",JSON.stringify(tokens));localStorage.setItem("m5font",JSON.stringify(font))}catch(e){}}
const FS=[1.12,1.25,1.4],FSN=["عادي","كبير","كبير جدًّا"];
function applyFont(){document.documentElement.style.zoom=FS[font]||1.12}
function fontStep(){font=(font+1)%FS.length;save();applyFont();toast("حجم الخط: "+FSN[font])}
applyFont();
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
let stack=[],cur=null;
function show(h){$("#app").innerHTML=h;$("#back").style.display=stack.length?"inline-block":"none";$("#tk").textContent=tokens;scrollTo(0,0)}
function go(fn,...a){if(cur)stack.push(cur);cur={fn,a};fn(...a)}
function back(){const p=stack.pop();if(p){cur=p;p.fn(...p.a)}}
const nDone=c=>c.ex.filter((_,i)=>done[c.id+"e"+i]).length;
const BADGES=[["🌟","أول 5 تمارين",5],["🔥","منتصف الطريق",Math.ceil(TOTAL/2)],["👑","خبير",TOTAL-6],["💎","أنهيت الكل",TOTAL]];

function home(){const n=Object.keys(done).filter(k=>ALL.some(e=>e.id===k)).length,pct=Math.round(n/TOTAL*100);
  show(`<section class="hero"><h1>🎓 مغامرة الرياضيات&nbsp;٥</h1><p>تدريب ممتع على رياضيات الصف الخامس، مع شرح لكل إجابة.</p>
  <div class="stats"><div><b>${n}/${TOTAL}</b><small>أنجزتها</small></div><div><b>${pct}%</b><small>تقدّمي</small></div><div><b>${tokens}</b><small>نجومي ⭐</small></div></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="badges">${BADGES.map(b=>`<span class="${n>=b[2]?"":"off"}" title="${b[1]}">${b[0]} ${b[1]}</span>`).join("")}</div></section>
  <h2>الفصول</h2>
  ${CHAPTERS.map((c,k)=>{const d=nDone(c);return `<button class="ch" onclick="go(chapter,${k})"><span class="ic" style="background:${c.c}22">${c.e}</span>
   <span style="flex:1;min-width:0"><b>${k+1}. ${c.t}</b><small>${d} من ${c.ex.length} تمارين</small><div class="bar mini"><i style="width:${d/c.ex.length*100}%"></i></div></span>${d===c.ex.length?`<span class="done">✓</span>`:""}</button>`}).join("")}
  <div class="foot">تمارين تدريبية أصلية · بلا حساب وبلا إعلانات · يعمل دون إنترنت بعد أول فتح<br>طوّره: حالم فاروق عبدالرحيم<br><a class="linkb" href="../">🏠 كل التطبيقات: رحلات تعليمية</a> · <button class="linkb" onclick="resetMine()">مسح تقدّمي في هذا التطبيق</button></div>`);
}
let S=null;
function chapter(k,i){const c=CHAPTERS[k];if(i===undefined){i=c.ex.findIndex((_,j)=>!done[c.id+"e"+j]);if(i<0)i=0}
  S={k,i,ans:null,checked:false};const e=ALL.find(x=>x.id===c.id+"e"+i);
  show(`<h2 style="margin-top:6px">${c.e} ${c.t}</h2>
  <div class="dots" aria-label="التمارين">${c.ex.map((_,j)=>`<button class="${done[c.id+"e"+j]?"ok":""} ${j===i?"now":""}" onclick="chapter(${k},${j})" aria-label="التمرين ${j+1}">${j+1}</button>`).join("")}</div>
  <div class="card"><div class="qtop"><span>التمرين ${i+1} من ${c.ex.length}${done[e.id]?" · أنجزته ✓":""}</span><span class="lvl ${e.d}">${LVL[e.d][0]} · ${LVL[e.d][1]} ⭐</span></div>
  <div class="q">${e.q}</div>${e.x?`<div class="x">${e.x}</div>`:""}${e.q2?`<div class="q">${e.q2}</div>`:""}
  ${e.t==="m"?e.o.map((o,j)=>`<button class="opt" id="o${j}" onclick="sel(${j})">${o}</button>`).join(""):
   `<div class="row"><input id="inp" class="inp" ${/\//.test(e.a)?'inputmode="text"':'inputmode="decimal"'} autocomplete="off" aria-label="اكتب إجابتك" placeholder="؟" onkeydown="if(event.key==='Enter')check()">${e.u?`<span class="unit">${e.u}</span>`:""}</div>`}
  <button class="hintb" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">💡 تلميح</button><div class="hint" hidden>${hintOf(e)}</div>
  <button class="go" id="chk" onclick="check()">تحقّق</button><div id="fb"></div></div>`);
}
function hintOf(e){return e.hi}
function sel(j){if(S.checked)return;S.ans=j;document.querySelectorAll(".opt").forEach((b,k)=>b.classList.toggle("sel",k===j))}
function norm(s){return String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[,٬،\s]/g,"").replace(/[٫]/g,".").replace(/[\\⁄∕]/g,"/")}
function val(s){s=norm(s);const m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m)return +m[2]?+m[1]/+m[2]:NaN;return s!==""&&!isNaN(+s)?+s:NaN}
function check(){if(S.checked)return;const c=CHAPTERS[S.k],e=ALL.find(x=>x.id===c.id+"e"+S.i);let ok,note="";
  if(e.t==="m"){if(S.ans===null){toast("اختر إجابة أولًا");return}ok=e.o[S.ans]===e.a}
  else{const raw=$("#inp").value;if(!raw.trim()){toast("اكتب إجابتك أولًا");$("#inp").focus();return}
    const v=val(raw);if(isNaN(v)){toast("اكتب رقمًا، أو كسرًا مثل 1/2");return}
    ok=Math.abs(v-val(e.a))<1e-9;
    if(ok&&/\//.test(e.a)&&norm(raw)!==norm(e.a)){note=`إجابتك <b dir="ltr">${esc(raw.trim())}</b> صحيحة، وأبسط صورة لها <b dir="ltr">${e.a}</b>.`}
    $("#inp").disabled=true;$("#inp").classList.add(ok?"good":"bad")}
  S.checked=true;
  if(e.t==="m")e.o.forEach((o,j)=>{const b=$("#o"+j);b.disabled=true;if(o===e.a)b.classList.add("good");else if(j===S.ans)b.classList.add("bad")});
  let gain=0;if(ok&&!done[e.id]){gain=LVL[e.d][1];done[e.id]=true;tokens+=gain;save()}
  $("#tk").textContent=tokens;$("#chk").remove();
  const nextI=c.ex.findIndex((_,j)=>j>S.i&&!done[c.id+"e"+j]),nxt=nextI>=0?nextI:(S.i+1<c.ex.length?S.i+1:-1);
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"✅ إجابة صحيحة!"+(gain?` +${gain} ⭐`:""):"❌ الإجابة الصحيحة: "+(e.t==="i"?`<span dir="ltr">${e.a}</span>`:e.a)+(e.u?" "+e.u:"")}</b>${note?"<br>"+note:""}<br>${e.h}</div>
  ${ok?"":`<button class="go alt" onclick="chapter(${S.k},${S.i})">🔁 حاول مرة أخرى</button>`}
  ${nxt>=0?`<button class="go" onclick="chapter(${S.k},${nxt})">التمرين التالي ←</button>`:`<button class="go" onclick="back()">${nDone(c)===c.ex.length?"🎉 أنهيت الفصل! العودة إلى الفصول":"العودة إلى الفصول"}</button>`}`;
  if(ok&&nDone(c)===c.ex.length&&gain)toast("🎉 أحسنت! أنهيت فصل «"+c.t+"»");
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function resetMine(){if(!confirm("مسح تقدّمك ونجومك في «مغامرة الرياضيات» فقط؟ (لن يتأثر أيّ تطبيق آخر)"))return;
  done={};tokens=0;try{localStorage.removeItem("completedEx");localStorage.removeItem("tokens")}catch(e){}stack=[];cur=null;go(home);toast("تم مسح التقدّم")}
go(home);
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
