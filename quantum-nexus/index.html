<style>
:root{--ink:#16123A;--ink2:#5B5A7E;--bg:#F3F1FF;--card:#fff;--line:#E0DCF5;--brand:#5B3FD9;--cyan:#0FB5CE;--good:#16A34A;--bad:#E5484D;--gold:#F5B800}
@media (prefers-color-scheme:dark){:root{--ink:#EEEAFF;--ink2:#B3AFD6;--bg:#0D0A24;--card:#1A1540;--line:#2E2860}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:17px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .brand{font-weight:900;font-size:17px;flex:1;display:flex;align-items:center;gap:8px}
.top .brand svg{width:30px;height:30px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
#back{display:none}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px}
.hero{position:relative;overflow:hidden;border-radius:26px;color:#fff;padding:22px 20px;margin:4px 0 18px;background:radial-gradient(110% 120% at 100% 0%,#0FB5CE 0%,rgba(15,181,206,0) 50%),linear-gradient(135deg,#2B1B6B 0%,#4B2BC4 55%,#7A3FE0 100%);box-shadow:0 12px 30px rgba(75,43,196,.35)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hero>*{position:relative}
.kick{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800}
.hero h1{margin:8px 0 2px;font-size:30px;line-height:1.25;font-weight:900}
.hero .en{font-size:15px;font-weight:700;opacity:.85}
.hero p{margin:8px 0 0;font-weight:600;color:rgba(255,255,255,.92)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:6px;text-align:center}
.stats b{display:block;font-size:20px;font-weight:900}.stats small{font-size:12px;font-weight:700;opacity:.9}
h2{font-size:19px;font-weight:900;margin:18px 2px 10px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:16px;border-radius:22px;border:0;color:#fff;background:linear-gradient(135deg,#0FB5CE,#4B2BC4);box-shadow:0 10px 22px rgba(15,181,206,.3)}
.big .ic{font-size:38px;flex:none}.big b{display:block;font-size:20px;font-weight:900}.big small{font-weight:700;opacity:.92}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:720px){.grid2{grid-template-columns:repeat(4,1fr)}}
.strand{display:flex;flex-direction:column;gap:6px;text-align:start;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:0 4px 12px rgba(43,27,107,.07);min-height:130px}
.strand .ic{font-size:30px}.strand b{font-size:16px;font-weight:900;line-height:1.35}.strand small{color:var(--ink2);font-weight:700;font-size:13px}
.strand.soon{opacity:.65;cursor:default}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0FB5CE,#5B3FD9);border-radius:999px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-weight:800;text-align:start}
.tool span{font-size:24px}.tool em{font-style:normal;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-inline-start:auto}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.lesson .ic{font-size:28px;flex:none}.lesson b{display:block;font-size:17px}.lesson small{color:var(--ink2);font-weight:700}
.stars{margin-inline-start:auto;color:var(--gold);font-size:16px;letter-spacing:1px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card ul{margin:0;padding-inline-start:20px}.card li{margin:4px 0}
.go{display:block;width:100%;border:0;border-radius:16px;padding:13px;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(135deg,#5B3FD9,#7A3FE0);box-shadow:0 6px 14px rgba(91,63,217,.3);margin-top:10px}
.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.qhead{display:flex;justify-content:space-between;color:var(--ink2);font-weight:800;font-size:14px;margin-bottom:6px}
.q{font-size:19px;font-weight:800;line-height:1.7;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:start;padding:12px 14px;margin-bottom:10px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:17px}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.fb{border-radius:16px;padding:12px 14px;margin-top:4px;font-weight:600}
.fb.good{background:color-mix(in srgb,var(--good) 12%,var(--card));border:1px solid var(--good)}
.fb.bad{background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid var(--bad)}
.score{font-size:46px;font-weight:900;text-align:center;margin:6px 0}
.center{text-align:center}
.muted{color:var(--ink2)}
.fine{color:var(--ink2);font-size:14px}
/* الجدول الدوري */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.legend button{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;background:var(--card);display:flex;align-items:center;gap:5px}
.legend button i{width:12px;height:12px;border-radius:4px;display:inline-block}
.legend button.on{outline:2px solid var(--brand)}
.search{width:100%;font:inherit;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.ptwrap{overflow-x:auto;padding-bottom:8px;margin:0 -14px;padding-inline:14px;direction:ltr}
.pt{display:grid;grid-template-columns:repeat(18,46px);gap:3px;width:max-content}
.el{width:46px;height:52px;border-radius:8px;border:0;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;color:#14102E;position:relative}
.el .n{font-size:9px;font-weight:700;position:absolute;top:2px;left:4px}
.el .s{font-size:17px;font-weight:900;font-family:system-ui,sans-serif}
.el .a{font-size:8.5px;font-weight:700;max-width:44px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;direction:rtl}
.el.dim{opacity:.18}
.el.gap{background:transparent!important;font-size:10px;color:var(--ink2);font-weight:800}
.c-alkali{background:#FF9AA2}.c-alkaline{background:#FFC48C}.c-trans{background:#FFE08A}.c-post{background:#B5EAD7}.c-metalloid{background:#9DE0E6}.c-nonmetal{background:#A0C4FF}.c-halogen{background:#C3B1FF}.c-noble{background:#FFB3E6}.c-lanth{background:#D4F29A}.c-act{background:#E8C7A0}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,8,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px 26px;max-height:85vh;overflow:auto}
.elhead{display:flex;align-items:center;gap:14px}
.elbig{width:86px;height:96px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#14102E;flex:none}
.elbig .s{font-size:36px;font-weight:900;font-family:system-ui,sans-serif;line-height:1}.elbig .n{font-weight:800}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.facts div{border:1px solid var(--line);border-radius:12px;padding:8px}.facts small{display:block;color:var(--ink2);font-weight:700;font-size:12px}.facts b{font-size:16px}
footer{text-align:center;color:var(--ink2);font-size:13px;margin-top:22px}
footer a{color:inherit}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16123A;color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;z-index:60}
@media (prefers-reduced-motion:reduce){.hero canvas{display:none}}
.ctrl{display:grid;gap:8px;margin-bottom:10px}.ctrl>div{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px}
.ctrl button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;font-weight:900}
.ctrl .cnt{margin-inline-start:auto;font-size:20px;font-weight:900;min-width:28px;text-align:center}
.dot{width:24px;height:24px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.pillx{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;background:var(--card)}.pillx i{width:12px;height:12px;border-radius:4px;display:inline-block}
.seg2{display:flex;gap:8px;margin-bottom:10px}.seg2 button{flex:1;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:14px}
.planets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.planets button{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card);color:var(--ink);font-weight:800;font-size:14px}.planets i{width:12px;height:12px;border-radius:50%}
input[type=range]{accent-color:#5B3FD9;height:32px}
#fs small{font-size:.7em}#fs{padding:4px 10px}.top .brand{white-space:nowrap;min-width:0}
@media (max-width:420px){html[data-font="1"] .bt,html[data-font="2"] .bt{display:none}}
.big.lab{background:linear-gradient(135deg,#0B7285,#5B3FD9);margin-top:12px}
</style>
</head>

const LESSONS=[{"id":"atom","t":"الذرة ومكوّناتها","e":"⚛️","sum":["الذرة أصغر جزء من العنصر يحمل خصائصه.","تتكوّن الذرة من نواة في المركز، وحولها إلكترونات تتحرك في سحابة إلكترونية.","في النواة بروتونات موجبة الشحنة ونيوترونات متعادلة؛ والإلكترونات سالبة الشحنة.","العدد الذري = عدد البروتونات، وهو الذي يميّز كل عنصر عن غيره.","العدد الكتلي = عدد البروتونات + عدد النيوترونات.","الذرة متعادلة لأن عدد إلكتروناتها يساوي عدد بروتوناتها."],"q":[["ما الجسيم الموجب الشحنة في الذرة؟",["البروتون","الإلكترون","النيوترون","الجزيء"],"البروتون موجب، والإلكترون سالب، والنيوترون متعادل لا شحنة له."],["أين توجد البروتونات والنيوترونات؟",["في النواة","في السحابة الإلكترونية","خارج الذرة","بين الذرات"],"تتجمّع البروتونات والنيوترونات في النواة في مركز الذرة."],["ما شحنة النيوترون؟",["متعادل (لا شحنة له)","موجبة","سالبة","موجبة مرة وسالبة مرة"],"اسمه يدل عليه: النيوترون «محايد» بلا شحنة."],["العدد الذري لعنصر يساوي عدد:",["البروتونات في نواته","النيوترونات في نواته","الذرات في الجزيء","البروتونات والنيوترونات معًا"],"العدد الذري هو عدد البروتونات، ولكل عنصر عدد ذري خاص به."],["ذرة فيها 6 بروتونات و6 نيوترونات. ما عددها الكتلي؟",["12","6","18","0"],"العدد الكتلي = البروتونات + النيوترونات = 6 + 6 = 12."],["ذرة متعادلة فيها 8 بروتونات. كم إلكترونًا فيها؟",["8","16","4","0"],"الذرة المتعادلة: عدد الإلكترونات = عدد البروتونات."],["ذرة عددها الذري 11 وعددها الكتلي 23. كم نيوترونًا في نواتها؟",["12","11","23","34"],"النيوترونات = العدد الكتلي − العدد الذري = 23 − 11 = 12."],["أيّ الجسيمات الآتية أخفّ كتلة بكثير من غيرها؟",["الإلكترون","البروتون","النيوترون","النواة"],"كتلة الإلكترون أصغر بنحو 1800 مرة من كتلة البروتون، لذلك تتركّز كتلة الذرة في النواة."],["ما الذي يميّز ذرة الأكسجين عن ذرة الكربون؟",["عدد البروتونات في النواة","حجم الإلكترون","لون النواة","عدد السحب الإلكترونية"],"لكل عنصر عدد بروتونات خاص به: الكربون 6، والأكسجين 8."],["لماذا تكون الذرة متعادلة كهربائيًّا؟",["لأن عدد إلكتروناتها يساوي عدد بروتوناتها","لأنها لا تحتوي على أيّ شحنات كهربائية","لأن النيوترونات تلغي شحنات البروتونات","لأن نواتها سالبة وإلكتروناتها موجبة"],"الشحنات الموجبة (البروتونات) تساوي الشحنات السالبة (الإلكترونات)، فتتعادل."],["ذرتان لهما العدد الذري نفسه وعددان كتليان مختلفان. ماذا تُسمّيان؟",["نظيرين للعنصر نفسه","عنصرين مختلفين","مركّبين","أيونين موجبين"],"النظائر: ذرات العنصر نفسه تختلف في عدد النيوترونات، فيختلف العدد الكتلي."],["الكربون-14 والكربون-12 يختلفان في عدد:",["النيوترونات","البروتونات","الإلكترونات في الذرة المتعادلة","العدد الذري"],"كلاهما كربون (6 بروتونات)، لكن في الكربون-14 ثمانية نيوترونات وفي الكربون-12 ستة."]],"s":"matter"},{"id":"table","t":"العناصر والجدول الدوري","e":"🧪","sum":["العنصر مادة نقية تتكوّن من نوع واحد من الذرات، ولا يمكن تجزئتها إلى مواد أبسط بالطرائق الكيميائية.","يُرتَّب الجدول الدوري الحديث بحسب العدد الذري تصاعديًّا.","الصفوف الأفقية تُسمّى الدورات (7 دورات)، والأعمدة الرأسية تُسمّى المجموعات (18 مجموعة).","عناصر المجموعة الواحدة متشابهة في خصائصها الكيميائية.","لكل عنصر رمز من حرف أو حرفين، الأول كبير دائمًا: O للأكسجين، Na للصوديوم."],"q":[["على أيّ أساس رُتّبت العناصر في الجدول الدوري الحديث؟",["العدد الذري تصاعديًّا","الكتلة الذرية تنازليًّا","الحروف الهجائية لأسمائها","تاريخ اكتشاف كل عنصر"],"رُتّبت بحسب العدد الذري؛ وكان مندليف قد رتّبها قبل ذلك بحسب الكتلة الذرية."],["ماذا تُسمّى الصفوف الأفقية في الجدول الدوري؟",["الدورات","المجموعات","العائلات","الفئات"],"الأفقية دورات، والرأسية مجموعات أو عائلات."],["كم مجموعة في الجدول الدوري الحديث؟",["18","7","8","118"],"في الجدول 18 مجموعة (عمودًا) و7 دورات (صفوف)."],["بماذا تتشابه عناصر المجموعة الواحدة؟",["خصائصها الكيميائية","كتلتها الذرية","لونها دائمًا","عدد نيوتروناتها"],"عناصر المجموعة الواحدة لها سلوك كيميائي متشابه."],["ما رمز عنصر الصوديوم؟",["Na","S","So","Sd"],"Na من اسمه اللاتيني Natrium."],["ما رمز عنصر الحديد؟",["Fe","I","Ir","H"],"Fe من اسمه اللاتيني Ferrum. أما I فرمز اليود."],["أيّ رمز مكتوب بطريقة صحيحة؟",["Ca","CA","ca","cA"],"الحرف الأول كبير والثاني صغير دائمًا."],["ما العنصر الذي عدده الذري 1؟",["الهيدروجين","الهيليوم","الأكسجين","الكربون"],"الهيدروجين أول عناصر الجدول وأخفّها."],["أيّ مما يأتي عنصر؟",["النحاس","الماء","ملح الطعام","الهواء"],"النحاس عنصر؛ الماء والملح مركّبان، والهواء مخلوط."],["من العالِم الذي وضع أول جدول دوري ناجح وترك فيه فراغات لعناصر لم تُكتشف بعد؟",["مندليف","نيوتن","دالتون","أينشتاين"],"رتّب مندليف العناصر عام 1869م وتنبّأ بخصائص عناصر لم تكن معروفة."],["إلى أيّ مجموعة ينتمي الهيليوم والنيون والأرغون؟",["الغازات النبيلة","الفلزات القلوية","الهالوجينات","الفلزات الانتقالية"],"الغازات النبيلة في المجموعة 18، وهي لا تكاد تتفاعل."],["أيّ الهالوجينات الآتية سائل في درجة حرارة الغرفة؟",["البروم","الكلور","الفلور","اليود"],"البروم سائل بنّي محمرّ؛ الفلور والكلور غازان، واليود صلب."]],"s":"matter"},{"id":"metals","t":"الفلزات واللافلزات وأشباه الفلزات","e":"🔩","sum":["الفلزات لامعة، جيدة التوصيل للحرارة والكهرباء، قابلة للطرق والسحب، ومعظمها صلب.","تقع الفلزات في يسار الجدول ووسطه، وهي أكثر العناصر عددًا.","اللافلزات غالبًا غير لامعة، رديئة التوصيل، والصلبة منها هشّة؛ وتقع في يمين الجدول.","أشباه الفلزات لها خصائص بين الفلزات واللافلزات، مثل السيليكون المستعمل في الإلكترونيات.","الزئبق فلز سائل في درجة حرارة الغرفة."],"q":[["أيّ الخصائص الآتية من خصائص الفلزات؟",["جيدة التوصيل للكهرباء","هشّة تتكسّر بسهولة","رديئة التوصيل للحرارة","غير لامعة"],"الفلزات موصلة جيدة للحرارة والكهرباء ولامعة وقابلة للطرق."],["لماذا تُصنع الأسلاك الكهربائية من النحاس؟",["لأنه موصل جيد للكهرباء ويمكن سحبه أسلاكًا","لأنه عازل جيد يمنع مرور الكهرباء","لأنه هشّ يسهل تكسيره قطعًا صغيرة","لأنه أخفّ الفلزات وأرخصها على الإطلاق"],"النحاس فلز جيد التوصيل وقابل للسحب."],["ما معنى أن الفلز «قابل للطرق»؟",["يمكن تشكيله صفائح بالطرق دون أن ينكسر","أنه يتفتّت قطعًا صغيرة إذا طُرق","أنه يذوب في الماء عند الطرق عليه","أنه يصدر صوتًا عاليًا فقط عند طرقه"],"قابلية الطرق: تشكيل الفلز صفائح رقيقة، مثل ورق الألومنيوم."],["أين تقع معظم اللافلزات في الجدول الدوري؟",["في الجهة اليمنى","في الجهة اليسرى","في الوسط","أسفل الجدول"],"اللافلزات في الجهة اليمنى العليا، والفلزات يسار الجدول ووسطه."],["أيّ العناصر الآتية لافلز؟",["الكبريت","الحديد","الذهب","الصوديوم"],"الكبريت لافلز أصفر هشّ؛ والبقية فلزات."],["أيّ الفلزات الآتية سائل في درجة حرارة الغرفة؟",["الزئبق","الحديد","النحاس","الألومنيوم"],"الزئبق الفلز الوحيد السائل في درجة حرارة الغرفة."],["أيّ العناصر الآتية من أشباه الفلزات؟",["السيليكون","الأكسجين","الفضة","الكالسيوم"],"السيليكون شبه فلز، ويُستعمل في رقائق الحواسيب والخلايا الشمسية."],["لماذا يُستعمل السيليكون في صناعة الإلكترونيات؟",["لأنه شبه موصل يمكن التحكم في توصيله","لأنه أفضل موصل للكهرباء بين العناصر","لأنه عازل تمامًا لا يمرّر أيّ تيار","لأنه سائل يسهل صبّه في القوالب"],"أشباه الفلزات توصل الكهرباء توصيلًا متوسطًا يمكن التحكم فيه."],["قطعة كبريت صفراء ضُربت بالمطرقة فتفتّتت. ماذا تدلّ هذه الخاصية؟",["أن الكبريت لافلز هشّ","أن الكبريت فلز","أن الكبريت قابل للطرق","أن الكبريت موصل جيد"],"الهشاشة من خصائص اللافلزات الصلبة."],["ما أكثر أنواع العناصر عددًا في الجدول الدوري؟",["الفلزات","اللافلزات","أشباه الفلزات","الغازات النبيلة"],"الفلزات تشغل معظم الجدول الدوري."]],"s":"matter"},{"id":"mix","t":"المركّبات والمخاليط","e":"🥤","sum":["المركّب مادة نقية تتكوّن من عنصرين أو أكثر متّحدين كيميائيًّا بنسب ثابتة، مثل الماء H₂O.","خصائص المركّب تختلف عن خصائص العناصر المكوّنة له.","المخلوط مادتان أو أكثر ممتزجتان دون اتحاد كيميائي، ويمكن فصلهما بطرائق فيزيائية.","المخلوط المتجانس (المحلول) مكوّناته لا تُرى منفصلة، مثل ماء السكر.","المخلوط غير المتجانس مكوّناته تُرى منفصلة، مثل الرمل والحصى.","من طرائق الفصل: الترشيح، والتبخير، والتقطير، والجذب بالمغناطيس."],"q":[["أيّ مما يأتي مركّب؟",["الماء","الأكسجين","الهواء","ماء البحر"],"الماء مركّب من الهيدروجين والأكسجين متّحدين كيميائيًّا."],["أيّ مما يأتي مخلوط؟",["الهواء","ثاني أكسيد الكربون","الحديد","ملح الطعام"],"الهواء مخلوط من غازات أهمها النيتروجين والأكسجين."],["كم ذرة هيدروجين في جزيء الماء H₂O؟",["2","1","3","0"],"الرقم الصغير 2 بعد H يعني ذرتين من الهيدروجين، مع ذرة أكسجين واحدة."],["الصوديوم فلز نشط، والكلور غاز سامّ؛ واتحادهما ينتج ملح الطعام. ماذا نستنتج؟",["خصائص المركّب تختلف عن خصائص عناصره","المركّب له خصائص عناصره نفسها","ملح الطعام سامّ","ملح الطعام مخلوط"],"عند الاتحاد الكيميائي تنتج مادة جديدة بخصائص جديدة."],["ماء مذاب فيه سكر حتى لم يعد السكر يُرى. ما نوع هذا المخلوط؟",["مخلوط متجانس (محلول)","مخلوط غير متجانس","مركّب","عنصر"],"المحلول مخلوط متجانس لا تُرى مكوّناته منفصلة."],["أيّ مما يأتي مخلوط غير متجانس؟",["الرمل والحصى","ماء السكر","الهواء النقي","الخلّ"],"في الرمل والحصى يمكن رؤية المكوّنات منفصلة."],["ما أنسب طريقة لفصل برادة الحديد عن الرمل؟",["المغناطيس","الترشيح","التبخير","التقطير"],"المغناطيس يجذب الحديد ولا يجذب الرمل."],["كيف نحصل على الملح من ماء مالح؟",["بالتبخير","بالمغناطيس","بالغربال","بالترشيح فقط"],"عند تبخير الماء يبقى الملح."],["ما أنسب طريقة لفصل الرمل عن الماء؟",["الترشيح","التبخير فقط","المغناطيس","الطرق"],"ورقة الترشيح تحجز الرمل ويمرّ الماء."],["ما الفرق الأساسي بين المركّب والمخلوط؟",["مكوّنات المركّب متّحدة كيميائيًّا بنسب ثابتة","المخلوط له صيغة كيميائية ثابتة دائمًا","مكوّنات المركّب تُفصل بالترشيح بسهولة","لا فرق بينهما إلا في اللون والرائحة"],"المركّب اتحاد كيميائي بنسب ثابتة، والمخلوط امتزاج فيزيائي بنسب متغيّرة."],["ما الطريقة المستعملة للحصول على ماء نقي من ماء البحر بتسخينه ثم تكثيف بخاره؟",["التقطير","الترشيح","المغناطيس","الترسيب"],"التقطير: تبخير السائل ثم تكثيف البخار في وعاء آخر."],["صيغة ثاني أكسيد الكربون CO₂. ما العناصر المكوّنة له؟",["الكربون والأكسجين","الكالسيوم والأكسجين","الكوبالت فقط","الكربون والكلور"],"C للكربون وO للأكسجين: ذرة كربون وذرتا أكسجين."]],"s":"matter"},{"id":"states","t":"حالات المادة وتحوّلاتها","e":"🧊","sum":["للمادة ثلاث حالات شائعة: صلبة، وسائلة، وغازية.","الصلب له شكل وحجم ثابتان؛ والسائل حجمه ثابت ويأخذ شكل الإناء؛ والغاز يملأ الإناء كله.","تتحرك الجسيمات أسرع كلما ارتفعت درجة الحرارة.","الانصهار: صلب ← سائل. التجمّد: سائل ← صلب. التبخّر: سائل ← غاز. التكثّف: غاز ← سائل.","يغلي الماء النقي عند 100 °س ويتجمّد عند 0 °س عند مستوى سطح البحر."],"q":[["أيّ حالة للمادة لها شكل ثابت وحجم ثابت؟",["الصلبة","السائلة","الغازية","كل الحالات"],"جسيمات الصلب متقاربة جدًّا وتهتز في أماكنها، فيبقى شكله وحجمه ثابتين."],["ماذا يحدث للسائل عند نقله من كأس إلى صحن؟",["يأخذ شكل الصحن ويبقى حجمه ثابتًا","يتغيّر حجمه وشكله معًا","يبقى شكله شكل الكأس نفسه","يتحوّل إلى غاز بمجرد نقله"],"السائل حجمه ثابت، لكنه يأخذ شكل الإناء."],["ما الحالة التي تنتشر فيها الجسيمات لتملأ الإناء كله؟",["الغازية","الصلبة","السائلة","لا توجد"],"جسيمات الغاز متباعدة وسريعة، فتملأ أيّ إناء توضع فيه."],["ما اسم تحوّل الماء من سائل إلى بخار؟",["التبخّر","التكثّف","التجمّد","الانصهار"],"التبخّر: تحوّل السائل إلى غاز."],["قطرات ماء تتكوّن على كأس عصير بارد. ما اسم هذا التحوّل؟",["التكثّف","التبخّر","الانصهار","التسامي"],"بخار الماء في الهواء يبرد عند الكأس فيتكثّف قطرات."],["قطعة جليد تُركت في الشمس فصارت ماءً. ما اسم هذا التحوّل؟",["الانصهار","التجمّد","التكثّف","التبخّر"],"الانصهار تحوّل الصلب إلى سائل بالتسخين."],["ماذا يحدث لحركة الجسيمات عند تسخين المادة؟",["تزداد سرعتها","تقلّ سرعتها","تتوقّف","لا تتغيّر"],"الحرارة تزيد طاقة الجسيمات فتتحرك أسرع."],["عند أيّ درجة حرارة يغلي الماء النقي عند مستوى سطح البحر؟",["100 °س","0 °س","50 °س","37 °س"],"درجة غليان الماء النقي 100 °س عند مستوى سطح البحر."],["ما الحالة التي تكون فيها الجسيمات أكثر تقاربًا؟",["الصلبة","السائلة","الغازية","كلها متساوية"],"في الصلب الجسيمات متراصّة؛ وفي الغاز متباعدة جدًّا."],["ما اسم تحوّل السائل إلى صلب عند التبريد؟",["التجمّد","الانصهار","التبخّر","الغليان"],"التجمّد عكس الانصهار."],["مكعّب ثلج جافّ (ثاني أكسيد الكربون الصلب) يتحوّل مباشرة إلى غاز. ما اسم هذا التحوّل؟",["التسامي","الانصهار","التكثّف","التجمّد"],"التسامي: تحوّل الصلب إلى غاز مباشرة دون المرور بالحالة السائلة."],["لماذا يمكن ضغط الغاز في أسطوانة، ولا يمكن ضغط الصلب بسهولة؟",["لأن بين جسيمات الغاز فراغات كبيرة","لأن جسيمات الغاز أثقل من جسيمات الصلب","لأن جسيمات الصلب متباعدة جدًّا","لأن الغاز ليس مادة فلا يشغل حيّزًا"],"الفراغات الكبيرة بين جسيمات الغاز تسمح بتقريبها بالضغط."]],"s":"matter"},{"id":"changes","t":"التغيّرات الفيزيائية والكيميائية","e":"🔥","sum":["التغيّر الفيزيائي يغيّر شكل المادة أو حالتها دون أن تتكوّن مادة جديدة، مثل تقطيع الورق وانصهار الجليد.","التغيّر الكيميائي تنتج عنه مادة جديدة بخصائص جديدة، مثل احتراق الخشب وصدأ الحديد.","من علامات التغيّر الكيميائي: تغيّر اللون، أو تصاعد غاز، أو انطلاق ضوء أو حرارة، أو تكوّن راسب.","الخاصية الفيزيائية تُقاس دون تغيير المادة (اللون، الكثافة، درجة الغليان)؛ والخاصية الكيميائية تظهر عند تفاعلها (القابلية للاشتعال، الصدأ)."],"q":[["أيّ مما يأتي تغيّر كيميائي؟",["احتراق الخشب","انصهار الجليد","تقطيع الورق","ذوبان السكر في الماء"],"الاحتراق ينتج رمادًا وغازات جديدة."],["أيّ مما يأتي تغيّر فيزيائي؟",["تكسير الزجاج","صدأ الحديد","طهي البيض","تعفّن الفاكهة"],"الزجاج المكسور ما زال زجاجًا؛ لم تتكوّن مادة جديدة."],["ما الذي يدلّ على حدوث تغيّر كيميائي؟",["تصاعد غاز وتغيّر في اللون","تغيّر شكل المادة فقط","تغيّر حجمها فقط","انتقالها من مكان إلى آخر"],"تصاعد الغاز وتغيّر اللون من علامات تكوّن مادة جديدة."],["صدأ الحديد تغيّر:",["كيميائي، لأن مادة جديدة (الصدأ) تكوّنت","فيزيائي، لأن الحديد بقي حديدًا","فيزيائي، لأنه تغيّر في اللون فقط","لا يُعدّ تغيّرًا"],"الصدأ مادة جديدة تتكوّن من تفاعل الحديد مع الأكسجين والماء."],["أيّ مما يأتي خاصية كيميائية؟",["قابلية الاشتعال","اللون","الكثافة","درجة الغليان"],"قابلية الاشتعال لا تظهر إلا عند تفاعل المادة."],["أيّ مما يأتي خاصية فيزيائية؟",["درجة الانصهار","القابلية للصدأ","القابلية للاحتراق","التفاعل مع الحمض"],"درجة الانصهار تُقاس دون أن تتكوّن مادة جديدة."],["خُلط الخلّ بصودا الخبز فظهرت فقاعات كثيرة. ماذا تدلّ الفقاعات؟",["تكوّن غاز جديد في تغيّر كيميائي","تبخّر الخلّ في تغيّر فيزيائي","ذوبان الصودا في الخلّ فقط","دخول الهواء إلى المخلوط عند تحريكه"],"الفقاعات غاز ثاني أكسيد الكربون الناتج عن التفاعل."],["لماذا يُعدّ ذوبان الملح في الماء تغيّرًا فيزيائيًّا؟",["لأن الملح يمكن استرجاعه بتبخير الماء","لأن مادة جديدة تتكوّن في الماء","لأن الملح يختفي تمامًا ولا يعود","لأن لون الماء يتغيّر بعد الذوبان"],"لم تتكوّن مادة جديدة، والملح يعود بالتبخير."],["أيّ مما يأتي تغيّر كيميائي يحدث في المطبخ؟",["خَبز الكعكة","تقطيع الخضار","غليان الماء","تجميد العصير"],"الخَبز يكوّن مواد جديدة لا يمكن إرجاعها إلى مكوّناتها."],["انطلاق ضوء وحرارة عند إشعال عود الثقاب يدلّ على:",["تغيّر كيميائي","تغيّر فيزيائي","تغيّر في الحالة فقط","لا شيء"],"انطلاق الضوء والحرارة من علامات التفاعل الكيميائي."]],"s":"matter"},{"id":"reactions","t":"التفاعلات الكيميائية والمعادلات","e":"⚗️","sum":["التفاعل الكيميائي: مواد متفاعلة تتحوّل إلى مواد ناتجة جديدة.","تُكتب المعادلة الكيميائية: المتفاعلات ← النواتج، مثل: 2H₂ + O₂ ← 2H₂O.","قانون حفظ الكتلة: كتلة المواد المتفاعلة = كتلة المواد الناتجة؛ فالذرات لا تُفنى ولا تُستحدث، بل يُعاد ترتيبها.","التفاعل الطارد للحرارة يطلق حرارة (مثل الاحتراق)، والماص للحرارة يمتصّها (مثل كمادات التبريد الفورية).","تزداد سرعة التفاعل برفع درجة الحرارة، وزيادة التركيز، وتجزئة المادة، واستعمال العامل المحفّز."],"q":[["ماذا تُسمّى المواد التي نبدأ بها التفاعل؟",["المتفاعلات","النواتج","المحفّزات","المخاليط"],"المتفاعلات تُكتب يسار السهم في المعادلة، والنواتج بعده."],["في المعادلة: C + O₂ ← CO₂ ، ما الناتج؟",["CO₂","C","O₂","C و O₂"],"الناتج ما يأتي بعد السهم."],["تفاعلت 10 غرامات من مواد، فكم غرامًا كتلة النواتج في وعاء مغلق؟",["10 غرامات","أقل من 10 غرامات","أكثر من 10 غرامات","صفر"],"قانون حفظ الكتلة: كتلة النواتج = كتلة المتفاعلات."],["ما الذي يحدث للذرات في التفاعل الكيميائي؟",["يُعاد ترتيبها لتكوّن مواد جديدة","تُفنى بعض الذرات وتختفي","تُستحدث ذرات جديدة لم تكن موجودة","تتحوّل ذرات كل عنصر إلى عنصر آخر"],"الذرات نفسها تبقى، لكنها ترتبط بطريقة جديدة."],["احتراق الوقود يطلق حرارة. ما نوع هذا التفاعل؟",["طارد للحرارة","ماص للحرارة","فيزيائي","لا يُعدّ تفاعلًا"],"التفاعل الطارد يطلق الحرارة إلى المحيط."],["كمّادة تبريد فورية تبرد عند الضغط عليها. ما نوع التفاعل داخلها؟",["ماص للحرارة","طارد للحرارة","احتراق","تكثّف"],"التفاعل يمتصّ الحرارة من المحيط فنشعر بالبرودة."],["لماذا يذوب قرص فوّار مطحون أسرع من قرص كامل؟",["لأن تجزئة المادة تزيد مساحة السطح فتزيد سرعة التفاعل","لأن المسحوق أثقل من القرص فيغوص بسرعة","لأن القرص الكامل لا يتفاعل مع الماء أبدًا","لأن طحن القرص يبرّد الماء فيزيد سرعة التفاعل"],"كلما زادت مساحة السطح المعرّضة للتفاعل زادت سرعته."],["ما دور العامل المحفّز في التفاعل؟",["يزيد سرعة التفاعل دون أن يُستهلك","يُبطئ التفاعل دائمًا ويُستهلك فيه","يتحوّل إلى أحد نواتج التفاعل","يوقف التفاعل تمامًا عند إضافته"],"المحفّز يسرّع التفاعل ويبقى في نهايته كما هو."],["لماذا نحفظ الطعام في الثلاجة؟",["لأن خفض الحرارة يُبطئ التفاعلات التي تفسده","لأن البرودة تزيد سرعة التفاعلات فيه","لأن الثلاجة تقتل كل الجراثيم تمامًا","لأن الطعام يتحوّل إلى عنصر لا يفسد"],"انخفاض درجة الحرارة يقلّل سرعة التفاعلات الكيميائية."],["في المعادلة الموزونة 2H₂ + O₂ ← 2H₂O ، كم ذرة أكسجين في النواتج؟",["2","1","4","3"],"2H₂O فيها جزيئان، في كل منهما ذرة أكسجين واحدة: المجموع 2، وهو يساوي ما في O₂."]],"s":"matter"},{"id":"acids","t":"الأحماض والقواعد","e":"🍋","sum":["الأحماض طعمها لاذع، وتُحمّر ورق تبّاع الشمس الأزرق، مثل الخلّ وعصير الليمون.","القواعد طعمها مرّ وملمسها زلق، وتُزرّق ورق تبّاع الشمس الأحمر، مثل الصابون.","مقياس pH من 0 إلى 14: أقل من 7 حمضي، و7 متعادل، وأكثر من 7 قاعدي.","التعادل: يتفاعل الحمض مع القاعدة فينتج ملح وماء.","تنبيه: لا نتذوّق ولا نلمس المواد في المختبر؛ فالأحماض والقواعد القوية تحرق الجلد."],"q":[["أيّ المواد الآتية حمضية؟",["عصير الليمون","الصابون","معجون الأسنان","مسحوق الغسيل"],"عصير الليمون فيه حمض الستريك."],["أيّ المواد الآتية قاعدية؟",["الصابون","الخلّ","عصير البرتقال","الحليب الحامض"],"الصابون مادة قاعدية ملمسها زلق."],["ماذا يحدث لورق تبّاع الشمس الأزرق في محلول حمضي؟",["يتحوّل إلى اللون الأحمر","يبقى أزرق","يتحوّل إلى الأخضر","يذوب في المحلول"],"الأحماض تُحمّر ورق تبّاع الشمس الأزرق."],["محلول قيمة pH له 7. ما نوعه؟",["متعادل","حمضي","قاعدي","حمضي قوي"],"القيمة 7 تعني التعادل، مثل الماء النقي."],["محلول قيمة pH له 2. ما نوعه؟",["حمضي","قاعدي","متعادل","لا يمكن معرفته"],"أقل من 7 حمضي، وكلما صغر الرقم زادت الحمضية."],["أيّ قيمة pH تدلّ على أقوى قاعدة؟",["13","8","7","3"],"أكثر من 7 قاعدي، وكلما كبر الرقم زادت القاعدية."],["ماذا ينتج عن تفاعل حمض مع قاعدة؟",["ملح وماء","غاز الأكسجين فقط","حمض أقوى","فلز"],"تفاعل التعادل ينتج ملحًا وماءً."],["لماذا يتناول بعض الناس مضادّ الحموضة عند حرقة المعدة؟",["لأنه قاعدة تعادل حمض المعدة الزائد","لأنه حمض يزيد حموضة المعدة","لأنه يقتل كل البكتيريا في المعدة","لأنه سكّر يمنح الجسم طاقة سريعة"],"مضادّ الحموضة قاعدة ضعيفة تعادل جزءًا من الحمض."],["ما الطريقة الآمنة لمعرفة هل المحلول حمضي أو قاعدي في المختبر؟",["استعمال كاشف مثل ورق تبّاع الشمس","تذوّق قطرة صغيرة منه بحذر","لمسه بطرف الإصبع لمعرفة ملمسه","شمّه عن قرب لمعرفة رائحته"],"لا نتذوّق ولا نلمس مواد المختبر؛ نستعمل الكواشف."],["أيّ مما يأتي من صفات القواعد؟",["ملمسها زلق وتُزرّق ورق تبّاع الشمس الأحمر","طعمها لاذع وتُحمّر ورق تبّاع الشمس الأزرق","قيمة pH لها أقل من 7","توجد في الليمون"],"هذه صفات القواعد؛ والبقية صفات الأحماض."],["قيمة pH للماء النقي تساوي تقريبًا:",["7","0","14","1"],"الماء النقي متعادل، وقيمة pH له نحو 7."],["الخلّ يحتوي على:",["حمض الأسيتيك","حمض الكبريتيك","هيدروكسيد الصوديوم","الأمونيا"],"الخلّ محلول مخفّف من حمض الأسيتيك (الخليك)."]],"s":"matter"},{"id":"cell","t":"الخلية: وحدة بناء الحياة","e":"🔬","sum":["الخلية أصغر وحدة تقوم بجميع وظائف الحياة، وكل المخلوقات الحية تتكوّن من خلية أو أكثر.","الغشاء البلازمي يحيط بالخلية وينظّم دخول المواد وخروجها.","النواة تتحكم في أنشطة الخلية وتحتوي على المادة الوراثية (DNA).","الميتوكوندريا تُطلق الطاقة من الغذاء، والبلاستيدات الخضراء في النبات تقوم بالبناء الضوئي.","تتميّز الخلية النباتية بجدار خلوي وبلاستيدات خضراء وفجوة عصارية كبيرة.","الخلايا المتشابهة تكوّن نسيجًا، والأنسجة تكوّن عضوًا، والأعضاء تكوّن جهازًا."],"q":[["ما أصغر وحدة تقوم بجميع وظائف الحياة؟",["الخلية","الذرة","النسيج","العضو"],"الخلية هي وحدة البناء والوظيفة في كل المخلوقات الحية."],["أيّ جزء يتحكم في أنشطة الخلية ويحتوي على المادة الوراثية؟",["النواة","الغشاء البلازمي","السيتوبلازم","الفجوة"],"النواة مركز التحكم، وفيها DNA."],["ما وظيفة الغشاء البلازمي؟",["ينظّم دخول المواد إلى الخلية وخروجها منها","يصنع الغذاء للخلية من ضوء الشمس","يحتوي على المادة الوراثية ويتحكم في الخلية","يعطي الخلية النباتية لونها الأخضر"],"الغشاء البلازمي يحيط بالخلية ويتحكم في ما يدخل ويخرج."],["أين تُطلَق الطاقة من الغذاء داخل الخلية؟",["الميتوكوندريا","البلاستيدات الخضراء","الجدار الخلوي","النواة"],"تُسمّى الميتوكوندريا «مصانع الطاقة» في الخلية."],["أيّ تركيب يوجد في الخلية النباتية ولا يوجد في الخلية الحيوانية؟",["الجدار الخلوي","الغشاء البلازمي","النواة","الميتوكوندريا"],"الجدار الخلوي يدعم الخلية النباتية ويحميها؛ أما البقية فموجودة في كلتيهما."],["ما وظيفة البلاستيدات الخضراء؟",["القيام بعملية البناء الضوئي","هضم الطعام داخل الخلية","نقل الرسائل العصبية","تخزين الدهون والماء"],"فيها الكلوروفيل الذي يمتصّ ضوء الشمس لصنع الغذاء."],["ما الترتيب الصحيح من الأبسط إلى الأعقد؟",["خلية ← نسيج ← عضو ← جهاز","نسيج ← خلية ← جهاز ← عضو","عضو ← خلية ← نسيج ← جهاز","جهاز ← عضو ← نسيج ← خلية"],"الخلايا المتشابهة تكوّن نسيجًا، والأنسجة تكوّن عضوًا، والأعضاء تكوّن جهازًا."],["القلب مثال على:",["عضو","خلية","نسيج","مخلوق حيّ"],"القلب عضو يتكوّن من عدة أنسجة، وهو جزء من جهاز الدوران."],["ما الأداة التي نستعملها لرؤية الخلايا؟",["المجهر","التلسكوب","الميزان","المسطرة"],"الخلايا صغيرة جدًّا، فنحتاج إلى المجهر لرؤيتها."],["المخلوق الذي يتكوّن من خلية واحدة يُسمّى:",["وحيد الخلية","عديد الخلايا","نسيجًا","عضوًا"],"مثل البكتيريا والبراميسيوم: خلية واحدة تقوم بكل وظائف الحياة."],["لماذا تحتوي خلايا العضلات على عدد كبير من الميتوكوندريا؟",["لأنها تحتاج إلى طاقة كثيرة للحركة","لأنها تصنع الغذاء بالبناء الضوئي","لأنها تحتاج إلى جدار خلوي سميك","لأنها تخزّن الماء للجسم كله"],"الميتوكوندريا تُطلق الطاقة، والعضلات تستهلك طاقة كبيرة."],["ما الذي يملأ الخلية وتسبح فيه العضيّات؟",["السيتوبلازم","الجدار الخلوي","النواة","الغشاء النووي"],"السيتوبلازم مادة هلامية داخل الخلية توجد فيها العضيّات."]],"s":"life"},{"id":"classify","t":"تصنيف المخلوقات الحية","e":"🦋","sum":["التصنيف: تجميع المخلوقات في مجموعات بحسب صفاتها المشتركة.","يُقسَم عالم الأحياء إلى ممالك، منها: الحيوانات، والنباتات، والفطريات، والطلائعيات، والبكتيريا.","التسمية الثنائية: لكل مخلوق اسم علمي من كلمتين: الجنس ثم النوع، مثل Homo sapiens للإنسان.","الحيوانات الفقارية لها عمود فقري (الأسماك، البرمائيات، الزواحف، الطيور، الثدييات)، واللافقارية ليس لها عمود فقري (الحشرات، الديدان...).","المفتاح الثنائي: أداة تصنيف تطرح سؤالين متقابلين في كل خطوة حتى نصل إلى اسم المخلوق."],"q":[["على أيّ أساس يُصنَّف العلماء المخلوقات الحية؟",["الصفات المشتركة بينها","حجمها فقط","ألوانها فقط","أماكن معيشتها فقط"],"يجمع التصنيف المخلوقات المتشابهة في صفاتها التركيبية وغيرها."],["الاسم العلمي للإنسان Homo sapiens. ماذا تمثّل الكلمة الأولى Homo؟",["الجنس","النوع","المملكة","الشعبة"],"في التسمية الثنائية: الكلمة الأولى الجنس، والثانية النوع."],["لماذا يستعمل العلماء الأسماء العلمية بدل الأسماء الشائعة؟",["لأن للمخلوق اسمًا علميًّا واحدًا يفهمه العلماء في كل العالم","لأنها أقصر وأسهل في النطق من الأسماء الشائعة","لأنها تُكتب بلغة كل بلد على حدة","لأنها تتغيّر كل عام بحسب اكتشافات جديدة"],"الأسماء الشائعة تختلف من بلد إلى آخر، أما الاسم العلمي فواحد."],["أيّ الحيوانات الآتية لافقاري؟",["النحلة","السمكة","الضفدع","الصقر"],"النحلة حشرة بلا عمود فقري؛ والبقية فقاريات."],["أيّ الحيوانات الآتية من الثدييات؟",["الحوت","سمك القرش","التمساح","البطريق"],"الحوت يرضع صغاره ويتنفس بالرئتين، فهو من الثدييات رغم أنه يعيش في البحر."],["إلى أيّ مملكة ينتمي فطر عيش الغراب؟",["الفطريات","النباتات","الحيوانات","البكتيريا"],"الفطريات لا تصنع غذاءها بنفسها، فهي مملكة مستقلة عن النباتات."],["ما الصفة التي تميّز الطيور عن غيرها من الفقاريات؟",["جسمها مغطّى بالريش","تتنفس بالرئتين","لها عمود فقري","تضع البيض"],"الريش صفة خاصة بالطيور؛ والصفات الأخرى تشترك فيها مع غيرها."],["ما فائدة المفتاح الثنائي؟",["التعرّف على المخلوق بالإجابة عن أسئلة متتالية","قياس طول المخلوق ووزنه بدقة","معرفة عمر المخلوق بعدد السنوات","تكبير صورة الخلية لرؤية أجزائها"],"يقدّم المفتاح الثنائي خيارين في كل خطوة حتى نصل إلى اسم المخلوق."],["الضفدع يعيش صغيرًا في الماء ويتنفس بالخياشيم، ثم يعيش على اليابسة بالغًا. إلى أيّ مجموعة ينتمي؟",["البرمائيات","الزواحف","الأسماك","الثدييات"],"البرمائيات تقضي جزءًا من حياتها في الماء وجزءًا على اليابسة."],["أيّ المخلوقات الآتية وحيد الخلية في الغالب؟",["البكتيريا","الفطر عيش الغراب","السرخس","الدودة الأرضية"],"البكتيريا مخلوقات دقيقة وحيدة الخلية."],["أيّ مما يأتي ترتيب صحيح لمستويات التصنيف من الأعمّ إلى الأخصّ؟",["مملكة ← شعبة ← طائفة ← رتبة ← فصيلة ← جنس ← نوع","نوع ← جنس ← مملكة ← شعبة ← طائفة ← رتبة ← فصيلة","جنس ← نوع ← مملكة ← رتبة ← شعبة ← طائفة ← فصيلة","مملكة ← نوع ← جنس ← فصيلة ← رتبة ← طائفة ← شعبة"],"يبدأ التصنيف بالمملكة (الأعمّ) وينتهي بالنوع (الأخصّ)."]],"s":"life"},{"id":"body1","t":"أجهزة الجسم: الهضم والدوران والتنفس","e":"❤️","sum":["الجهاز الهضمي يحوّل الطعام إلى مواد بسيطة يمتصّها الجسم؛ ومعظم الامتصاص يحدث في الأمعاء الدقيقة.","يبدأ الهضم في الفم بالمضغ واللعاب، ثم المريء، فالمعدة، فالأمعاء الدقيقة، ثم الأمعاء الغليظة.","جهاز الدوران: القلب يضخّ الدم في الأوعية الدموية: الشرايين تحمل الدم من القلب، والأوردة تعيده إليه، والشعيرات تصل بينهما.","خلايا الدم الحمراء تنقل الأكسجين، والبيضاء تحارب الجراثيم، والصفائح تساعد على تخثّر الدم.","الجهاز التنفسي: يدخل الهواء عبر الأنف والقصبة الهوائية إلى الرئتين، ويحدث تبادل الغازات في الحويصلات الهوائية."],"q":[["أين يبدأ الهضم؟",["في الفم","في المعدة","في الأمعاء الدقيقة","في المريء"],"يبدأ الهضم في الفم بالمضغ وباللعاب."],["أين يُمتصّ معظم الغذاء المهضوم إلى الدم؟",["الأمعاء الدقيقة","المعدة","المريء","الأمعاء الغليظة"],"جدار الأمعاء الدقيقة فيه خملات كثيرة تزيد مساحة الامتصاص."],["ما الوظيفة الرئيسة للأمعاء الغليظة؟",["امتصاص الماء من بقايا الطعام","هضم البروتينات بالعصارات","ضخّ الدم إلى أجزاء الجسم","تبادل الغازات مع الهواء"],"تمتصّ الأمعاء الغليظة الماء، وتتكوّن فيها الفضلات."],["ما العضو الذي يضخّ الدم إلى جميع أجزاء الجسم؟",["القلب","الرئتان","الكبد","المعدة"],"القلب عضلة تنقبض باستمرار لتضخّ الدم."],["ما الأوعية التي تحمل الدم من القلب إلى أجزاء الجسم؟",["الشرايين","الأوردة","الشعيرات فقط","القصبة الهوائية"],"الشرايين تخرج من القلب، والأوردة تعود إليه."],["ما وظيفة خلايا الدم الحمراء؟",["نقل الأكسجين","محاربة الجراثيم","تخثّر الدم","هضم الطعام"],"تحتوي على الهيموجلوبين الذي يرتبط بالأكسجين."],["ما وظيفة خلايا الدم البيضاء؟",["محاربة الجراثيم والدفاع عن الجسم","نقل الأكسجين إلى خلايا الجسم","المساعدة على تجلّط الدم عند الجروح","نقل الغذاء المهضوم إلى العضلات"],"خلايا الدم البيضاء جزء من جهاز المناعة."],["عند جرح الإصبع يتوقّف النزيف بعد قليل. ما الذي يساعد على ذلك؟",["الصفائح الدموية","خلايا الدم الحمراء","البلازما وحدها","الشرايين"],"الصفائح الدموية تساعد على تكوين الخثرة التي تسدّ الجرح."],["أين يحدث تبادل الأكسجين وثاني أكسيد الكربون في الرئتين؟",["في الحويصلات الهوائية","في القصبة الهوائية","في الأنف","في الحنجرة"],"الحويصلات الهوائية رقيقة الجدران ومحاطة بالشعيرات الدموية."],["ما الغاز الذي يتخلّص منه الجسم في الزفير؟",["ثاني أكسيد الكربون","الأكسجين","النيتروجين فقط","الهيدروجين"],"ثاني أكسيد الكربون ناتج عن إطلاق الطاقة في الخلايا."],["لماذا يزداد معدّل التنفّس ونبض القلب في أثناء الجري؟",["لأن العضلات تحتاج إلى أكسجين وطاقة أكثر","لأن الجسم يبرد فيحتاج إلى تدفئة","لأن الهضم يتوقف فيعمل القلب بدلًا منه","لأن كمية الدم في الجسم تقلّ"],"يعمل جهازا الدوران والتنفس معًا لإيصال الأكسجين إلى العضلات بسرعة."],["أيّ عادة تحمي الجهاز التنفسي؟",["الابتعاد عن التدخين ودخانه","الجلوس في الأماكن المغلقة المليئة بالدخان","التنفّس من الفم دائمًا","قلّة الحركة"],"التدخين يضرّ الرئتين والحويصلات الهوائية ضررًا كبيرًا."]],"s":"life"},{"id":"body2","t":"أجهزة الجسم: الحركة والإحساس والمناعة","e":"🧠","sum":["الجهاز الهيكلي يدعم الجسم ويحمي أعضاءه الداخلية؛ فالجمجمة تحمي الدماغ، والقفص الصدري يحمي القلب والرئتين.","الجهاز العضلي يحرّك الجسم؛ والعضلات تعمل بالانقباض، وغالبًا تعمل في أزواج.","المفصل مكان التقاء عظمتين، ويسمح بالحركة.","الجهاز العصبي يتكوّن من الدماغ والحبل الشوكي والأعصاب، وينقل الرسائل ويتحكم في الجسم.","الفعل المنعكس استجابة سريعة لا إرادية، مثل سحب اليد عند لمس شيء ساخن.","جهاز المناعة يدافع عن الجسم، والتطعيم يساعده على مقاومة الأمراض."],"q":[["ما الذي يحمي الدماغ؟",["الجمجمة","القفص الصدري","العمود الفقري","الحوض"],"الجمجمة عظام صلبة تحيط بالدماغ وتحميه."],["ما الذي يحمي القلب والرئتين؟",["القفص الصدري","الجمجمة","عظام الساق","المفاصل"],"الأضلاع تكوّن قفصًا يحمي أعضاء الصدر."],["ماذا نُسمّي مكان التقاء عظمتين؟",["المفصل","العضلة","الوتر","النخاع"],"المفاصل تسمح بحركة العظام، مثل مفصل الركبة."],["كيف تحرّك العضلات العظام؟",["بالانقباض فتسحب العظمة","بدفع العظمة إلى الأمام","بالانقسام","بتغيير لونها"],"العضلة تسحب ولا تدفع؛ لذلك تعمل العضلات غالبًا في أزواج متقابلة."],["ما أجزاء الجهاز العصبي المركزي؟",["الدماغ والحبل الشوكي","القلب والأوعية الدموية","المعدة والأمعاء الدقيقة","العظام والعضلات الهيكلية"],"الدماغ والحبل الشوكي هما الجهاز العصبي المركزي، والأعصاب تصلهما بأجزاء الجسم."],["لمست يدك إناءً ساخنًا فسحبتها بسرعة قبل أن تفكّر. ماذا يُسمّى هذا؟",["فعلًا منعكسًا","فعلًا إراديًّا","هضمًا","تنفّسًا"],"الفعل المنعكس سريع ولا إرادي، ويحمي الجسم من الأذى."],["ما وظيفة الأعصاب؟",["نقل الرسائل بين الدماغ وأجزاء الجسم","ضخّ الدم من القلب إلى الأعضاء","هضم الطعام وامتصاصه في الأمعاء","تخزين الدهون والطاقة في الجسم"],"الأعصاب كأسلاك تنقل الإشارات من الدماغ وإليه."],["أيّ مما يأتي يقوّي العظام؟",["الكالسيوم والنشاط البدني","المشروبات الغازية والحلويات","قلّة الحركة والجلوس الطويل","السهر وقلّة النوم"],"الكالسيوم (في الحليب ومنتجاته) والحركة يقوّيان العظام."],["ما الحاسة التي يُعدّ الجلد عضوها؟",["اللمس","البصر","السمع","الشمّ"],"في الجلد مستقبلات للّمس والحرارة والألم."],["كيف يساعد التطعيم الجسم؟",["يدرّب جهاز المناعة على مقاومة مرض معيّن","يقتل كل الجراثيم في الجسم فورًا","يزيد سرعة الهضم وامتصاص الغذاء","يقوّي العظام ويزيد طول الجسم"],"التطعيم يجعل جهاز المناعة مستعدًّا للتعرّف على الميكروب ومقاومته."],["لماذا يُعدّ غسل اليدين مهمًّا؟",["لأنه يقلّل انتقال الجراثيم والأمراض","لأنه يقوّي عضلات اليدين والأصابع","لأنه يزيد طول الجسم مع الوقت","لأنه يغني عن النوم والراحة"],"كثير من الأمراض تنتقل باليدين الملوّثتين."]],"s":"life"},{"id":"genetics","t":"الوراثة والصفات","e":"🧬","sum":["الوراثة: انتقال الصفات من الآباء إلى الأبناء.","الجينات أجزاء من DNA تحمل الصفات الوراثية، وتوجد على الكروموسومات في النواة.","يرث الفرد نصف جيناته من الأم ونصفها من الأب.","الصفة السائدة تظهر إذا وُجد جين واحد لها، والصفة المتنحّية لا تظهر إلا إذا وُجد جينان لها.","يُعدّ مندل «أبا علم الوراثة»؛ فقد درس توارث الصفات في نبات البازلاء.","بعض الصفات مكتسبة من البيئة والتعلّم، مثل ركوب الدراجة، ولا تورَّث."],"q":[["ماذا نُسمّي انتقال الصفات من الآباء إلى الأبناء؟",["الوراثة","التصنيف","الهضم","التكيّف"],"الوراثة هي انتقال الصفات عبر الجينات."],["أين توجد الجينات في الخلية؟",["على الكروموسومات في النواة","في الغشاء البلازمي حول الخلية","في الجدار الخلوي للخلية","في الفجوة العصارية"],"الكروموسومات في النواة تتكوّن من DNA الذي يحمل الجينات."],["من أين يأتي نصف جيناتك؟",["من الأم، والنصف الآخر من الأب","كلها من الأم، ولا شيء من الأب","كلها من الأب، ولا شيء من الأم","من البيئة والطعام الذي تأكله"],"يرث كل فرد نصف جيناته من كل والد."],["من العالِم الملقّب بأبي علم الوراثة؟",["مندل","مندليف","نيوتن","باستير"],"درس مندل توارث الصفات في نبات البازلاء. (أما مندليف فصاحب الجدول الدوري.)"],["أيّ مما يأتي صفة مكتسبة لا تورَّث؟",["إتقان السباحة","لون العينين","فصيلة الدم","شكل شحمة الأذن"],"المهارات تُكتسب بالتعلّم والتدريب، ولا تنتقل بالجينات."],["أيّ مما يأتي صفة وراثية؟",["لون الشعر الطبيعي","معرفة لغة أجنبية","ندبة جرح قديم","مهارة الرسم بالتدريب"],"لون الشعر الطبيعي تحدّده الجينات."],["ما الصفة التي تظهر إذا وُجد جين واحد لها فقط؟",["الصفة السائدة","الصفة المتنحّية","الصفة المكتسبة","لا توجد صفة كهذه"],"الجين السائد يُخفي أثر الجين المتنحّي."],["متى تظهر الصفة المتنحّية؟",["إذا ورث الفرد جينين متنحّيين لها","إذا ورث جينًا سائدًا واحدًا","دائمًا","لا تظهر أبدًا"],"الصفة المتنحّية تحتاج إلى نسختين من الجين المتنحّي."],["أبوان طويلان أنجبا طفلًا قصيرًا. ما التفسير الممكن؟",["كلاهما يحمل جينًا متنحّيًا للقِصَر","الطفل لم يرث أيّ جين من أبويه","الطول صفة مكتسبة لا علاقة لها بالجينات","هذا مستحيل لأن الصفات تنتقل كما هي"],"قد يحمل الأبوان جينًا متنحّيًا مختفيًا، فإذا ورث الطفل النسختين ظهرت الصفة."],["ما المادة التي تتكوّن منها الجينات؟",["DNA","البروتين فقط","الدهون","السكر"],"الجينات أجزاء من جزيء DNA."]],"s":"life"},{"id":"plants","t":"النباتات والبناء الضوئي","e":"🌱","sum":["البناء الضوئي: يصنع النبات غذاءه (السكر) من الماء وثاني أكسيد الكربون مستعملًا طاقة الضوء، ويُطلق الأكسجين.","يحدث البناء الضوئي في البلاستيدات الخضراء التي تحتوي على الكلوروفيل، وأغلبها في الأوراق.","الجذور تثبّت النبات وتمتصّ الماء والأملاح، والساق تنقل المواد وتدعم النبات.","الثغور فتحات صغيرة في الورقة يدخل منها ثاني أكسيد الكربون ويخرج الأكسجين وبخار الماء.","النباتات الزهرية تتكاثر بالبذور، والسراخس والحزازيات تتكاثر بالأبواغ."],"q":[["ما المواد التي يحتاج إليها النبات للقيام بالبناء الضوئي؟",["الماء وثاني أكسيد الكربون وضوء الشمس","الأكسجين والسكر وضوء القمر","التربة والأملاح فقط دون ضوء","الأكسجين والنيتروجين والظل"],"يصنع النبات السكر من الماء وثاني أكسيد الكربون باستعمال طاقة الضوء."],["ما الغاز الذي يُطلقه النبات في البناء الضوئي؟",["الأكسجين","ثاني أكسيد الكربون","النيتروجين","الهيليوم"],"الأكسجين الذي نتنفّسه ناتج من نواتج البناء الضوئي."],["أين يحدث البناء الضوئي في الخلية النباتية؟",["البلاستيدات الخضراء","الميتوكوندريا","النواة","الجدار الخلوي"],"البلاستيدات الخضراء تحتوي على الكلوروفيل الذي يمتصّ الضوء."],["ما وظيفة الجذور؟",["تثبيت النبات وامتصاص الماء والأملاح","صنع الغذاء بالضوء في التربة","إنتاج البذور والأزهار فقط","إطلاق الأكسجين إلى الهواء"],"الجذور تمتدّ في التربة فتثبّت النبات وتمتصّ ما يحتاج إليه."],["ما الثغور؟",["فتحات صغيرة في الورقة لتبادل الغازات","أجزاء دقيقة من الجذر تمتصّ الماء","بذور صغيرة داخل الثمرة","خلايا في الساق تنقل الماء"],"عبر الثغور يدخل ثاني أكسيد الكربون ويخرج الأكسجين وبخار الماء."],["لماذا لون معظم الأوراق أخضر؟",["لوجود الكلوروفيل","لوجود الماء","لوجود الأكسجين","لأنها تمتصّ اللون الأخضر"],"الكلوروفيل صبغة خضراء تمتصّ معظم ألوان الضوء وتعكس الأخضر."],["نبات وُضع في غرفة مظلمة أيامًا فذبل. ما السبب الأرجح؟",["لم يستطع القيام بالبناء الضوئي لصنع غذائه","زاد الضوء عليه فاحترقت أوراقه","زاد الأكسجين في الغرفة فتسمّم","كثرت الثغور في أوراقه فجأة"],"بلا ضوء لا يصنع النبات غذاءه."],["بماذا تتكاثر السراخس؟",["بالأبواغ","بالبذور","بالأزهار","بالثمار"],"السراخس والحزازيات نباتات لا بذرية تتكاثر بالأبواغ."],["ما الجزء الذي يتحوّل إلى ثمرة في النبات الزهري بعد التلقيح؟",["المبيض","الورقة","الجذر","الساق"],"بعد التلقيح والإخصاب ينمو المبيض فيصبح ثمرة تحيط بالبذور."],["كيف تساعد النحلة النبات؟",["تنقل حبوب اللقاح من زهرة إلى أخرى","تصنع له الغذاء في أوراقه","تسقيه بالماء الذي تحمله","تحمي جذوره من الحشرات الضارة"],"نقل حبوب اللقاح يساعد على التلقيح وتكوين البذور والثمار."],["ما الذي ينقل الماء من الجذور إلى الأوراق؟",["أنسجة النقل في الساق","الثغور في سطح الورقة","البلاستيدات الخضراء في الخلايا","الأزهار والبذور في أعلى النبات"],"في الساق أنسجة كالأنابيب تنقل الماء والمواد الغذائية."]],"s":"life"},{"id":"ecosystems","t":"الأنظمة البيئية","e":"🌍","sum":["النظام البيئي: المخلوقات الحية في منطقة ما، والعوامل غير الحية حولها (الماء، الضوء، التربة، الحرارة).","المنتِجات (النباتات) تصنع غذاءها، والمستهلِكات تتغذّى على غيرها، والمحلِّلات (الفطريات والبكتيريا) تحلّل بقايا المخلوقات.","السلسلة الغذائية تبيّن انتقال الطاقة: نبات ← آكل نبات ← آكل لحوم.","الشبكة الغذائية مجموعة سلاسل غذائية متداخلة.","تقلّ الطاقة المنتقلة كلما صعدنا في هرم الطاقة، لذلك تكون المنتجات أكثر عددًا.","التكيّف: صفة تساعد المخلوق على البقاء في بيئته، مثل سنام الجمل وخُفّه."],"q":[["أيّ مما يأتي عامل غير حيّ في النظام البيئي؟",["ضوء الشمس","العشب","الأرنب","الفطر"],"العوامل غير الحية: الضوء، والماء، والتربة، والحرارة، والهواء."],["ماذا نسمّي المخلوقات التي تصنع غذاءها بنفسها؟",["المنتِجات","المستهلِكات","المحلِّلات","المفترسات"],"النباتات منتجات لأنها تصنع غذاءها بالبناء الضوئي."],["ما دور الفطريات والبكتيريا في النظام البيئي؟",["تحليل بقايا المخلوقات وإعادة المواد إلى التربة","صنع الغذاء من ضوء الشمس كالنباتات","افتراس الحيوانات الكبيرة والتغذّي عليها","إطلاق الضوء والحرارة في التربة"],"المحلِّلات تعيد العناصر الغذائية إلى التربة ليستعملها النبات من جديد."],["في السلسلة: عشب ← جرادة ← ضفدع ← ثعبان، ما المنتِج؟",["العشب","الجرادة","الضفدع","الثعبان"],"السلسلة تبدأ دائمًا بالمنتِج الذي يصنع غذاءه."],["في السلسلة نفسها: عشب ← جرادة ← ضفدع ← ثعبان، ماذا تمثّل الجرادة؟",["مستهلِكًا أوّل (آكل عشب)","منتِجًا","محلِّلًا","مستهلِكًا ثالثًا"],"الجرادة تأكل العشب مباشرة، فهي مستهلك أوّل."],["ماذا تبيّن الأسهم في السلسلة الغذائية؟",["اتجاه انتقال الطاقة من المأكول إلى الآكل","اتجاه حركة الحيوانات في المكان","ترتيب المخلوقات من الأصغر إلى الأكبر","عدد المخلوقات في كل مستوى"],"السهم يتجه من الكائن الذي يؤكَل إلى الذي يأكله."],["لماذا تكون المنتِجات أكثر عددًا في هرم الطاقة؟",["لأن جزءًا كبيرًا من الطاقة يُفقد في كل مستوى","لأن النباتات لا تموت ولا تُؤكل","لأن المفترسات لا تحتاج إلى طاقة","لأن الطاقة تزداد كلما صعدنا في الهرم"],"تقلّ الطاقة المتاحة كلما صعدنا، فتحتاج القمة إلى قاعدة كبيرة من المنتجات."],["ما الشبكة الغذائية؟",["مجموعة سلاسل غذائية متداخلة","سلسلة واحدة طويلة","نوع من النباتات","مكان يعيش فيه الحيوان"],"في الطبيعة يأكل الحيوان أكثر من نوع، فتتداخل السلاسل في شبكة."],["أيّ صفة تساعد الجمل على العيش في الصحراء؟",["خُفّه العريض الذي لا يغوص في الرمل","فراؤه الكثيف جدًّا للبرد القارس","خياشيمه التي يتنفّس بها في الماء","جناحاه اللذان يطير بهما بعيدًا"],"الخف العريض تكيّف مع الرمال."],["ماذا يحدث على الأرجح لو اختفت المنتِجات من نظام بيئي؟",["تقلّ المستهلِكات أو تختفي لعدم وجود غذاء","تزداد المستهلِكات لقلة المنافسة","لا يتغيّر شيء في النظام البيئي","تزداد الطاقة المتاحة للحيوانات"],"المنتجات أساس كل السلاسل الغذائية."],["أيّ تصرّف يحمي النظام البيئي؟",["عدم رمي النفايات والمحافظة على النباتات","قطع الأشجار دون زراعة بدلها","الصيد الجائر للحيوانات النادرة","رمي النفايات في مصادر المياه"],"المحافظة على المكوّنات الحية وغير الحية تحفظ توازن النظام البيئي."],["أيّ مخلوق مستهلِك؟",["الأرنب","شجرة النخيل","العشب","الطحالب الخضراء"],"الأرنب يتغذّى على النباتات، فهو مستهلك؛ والبقية منتجات."]],"s":"life"},{"id":"motion","t":"الحركة والسرعة","e":"🏃","sum":["الحركة تغيّر موقع الجسم بالنسبة إلى نقطة مرجعية.","السرعة = المسافة ÷ الزمن، وتُقاس غالبًا بالمتر لكل ثانية (م/ث) أو الكيلومتر لكل ساعة (كم/ساعة).","السرعة المتجهة: سرعة واتجاه معًا، مثل 60 كم/ساعة نحو الشمال.","التسارع: تغيّر السرعة المتجهة مع الزمن؛ ويحدث عند الإسراع أو الإبطاء أو تغيير الاتجاه."],"q":[["قطعت سيارة 120 كيلومترًا في ساعتين. ما سرعتها المتوسطة؟",["60 كم/ساعة","240 كم/ساعة","120 كم/ساعة","30 كم/ساعة"],"السرعة = المسافة ÷ الزمن = 120 ÷ 2 = 60 كم/ساعة."],["ركض طالب 100 متر في 20 ثانية. ما سرعته؟",["5 م/ث","2000 م/ث","20 م/ث","0.2 م/ث"],"100 ÷ 20 = 5 أمتار في كل ثانية."],["ما الذي نحتاج إليه لنقول إن جسمًا يتحرّك؟",["نقطة مرجعية نقارن بها موقعه","ميزان نقيس به كتلة الجسم","مغناطيس قوي نجذب به الجسم","مصباح نضيء به مكان الجسم"],"الحركة تُعرَف بتغيّر الموقع بالنسبة إلى نقطة مرجعية."],["أيّ مما يأتي يعبّر عن سرعة متجهة؟",["50 كم/ساعة نحو الشرق","50 كم/ساعة","50 كيلومترًا","50 ساعة"],"السرعة المتجهة تذكر المقدار والاتجاه معًا."],["سيارة تسير بسرعة ثابتة في طريق دائري. هل لها تسارع؟",["نعم، لأن اتجاهها يتغيّر","لا، لأن سرعتها ثابتة","لا، لأنها لا تتحرك","نعم، لأن وزنها يتغيّر"],"التسارع تغيّر في السرعة المتجهة، وتغيير الاتجاه وحده تسارع."],["أيّ الأمثلة الآتية فيه تسارع؟",["حافلة تتوقف عند الإشارة","كتاب ساكن على الطاولة","سيارة تسير بسرعة ثابتة في خط مستقيم","حجر لا يتحرك"],"الإبطاء حتى التوقف تغيّر في السرعة، فهو تسارع."],["ما وحدة قياس السرعة في النظام الدولي؟",["متر لكل ثانية","كيلوغرام","نيوتن","جول"],"م/ث هي وحدة السرعة في النظام الدولي للوحدات."],["دراجة سرعتها 10 م/ث. كم مترًا تقطع في 6 ثوانٍ؟",["60 مترًا","16 مترًا","4 أمتار","600 متر"],"المسافة = السرعة × الزمن = 10 × 6 = 60 مترًا."],["أيّ الحيوانات الآتية أسرع إذا قطع كلٌّ منها 100 متر: الأول في 5 ثوانٍ، والثاني في 10، والثالث في 20؟",["الأول","الثاني","الثالث","سرعاتها متساوية"],"من يقطع المسافة نفسها في زمن أقل يكون أسرع."],["ما الذي يحدث لسرعة جسم يتسارع إلى الأمام في خط مستقيم؟",["تزداد","تقلّ","تبقى صفرًا","تصبح سالبة دائمًا"],"التسارع في اتجاه الحركة يزيد السرعة."]],"s":"energy"},{"id":"forces","t":"القوى وقوانين نيوتن","e":"🍎","sum":["القوة دفع أو سحب، وتُقاس بوحدة النيوتن (N).","القانون الأول: الجسم يبقى ساكنًا أو متحركًا بسرعة ثابتة ما لم تؤثّر فيه قوة محصّلة (القصور الذاتي).","القانون الثاني: القوة = الكتلة × التسارع؛ فالقوة الأكبر تُحدث تسارعًا أكبر.","القانون الثالث: لكل فعل ردّ فعل مساوٍ له في المقدار ومعاكس له في الاتجاه.","الاحتكاك قوة تعاكس الحركة، والجاذبية قوة تجذب الأجسام نحو بعضها، ووزن الجسم قوة جذب الأرض له."],"q":[["ما وحدة قياس القوة؟",["النيوتن","الجول","الواط","المتر"],"سُمّيت باسم العالِم إسحاق نيوتن."],["لماذا يندفع الركّاب إلى الأمام عندما تتوقف الحافلة فجأة؟",["بسبب القصور الذاتي","لأن الحافلة تدفعهم","بسبب الاحتكاك فقط","لأن وزنهم يزداد"],"أجسامهم تميل إلى الاستمرار في الحركة (القانون الأول)؛ ولهذا نربط حزام الأمان."],["ما القوة التي تُبطئ كرة تتدحرج على العشب حتى تقف؟",["الاحتكاك","المغناطيسية","القصور الذاتي","الطفو"],"الاحتكاك يعاكس الحركة، وهو كبير على العشب."],["دُفعت كتلتان بالقوة نفسها. أيّهما تتسارع أكثر؟",["الكتلة الأصغر","الكتلة الأكبر","تتسارعان بالمقدار نفسه","لا تتسارع أيّ منهما"],"التسارع = القوة ÷ الكتلة؛ فالكتلة الأصغر تتسارع أكثر."],["قوة مقدارها 10 نيوتن أثّرت في كتلة 2 كغ. ما التسارع؟",["5 م/ث²","20 م/ث²","12 م/ث²","0.2 م/ث²"],"التسارع = القوة ÷ الكتلة = 10 ÷ 2 = 5 م/ث²."],["عندما تقفز من قارب صغير إلى الشاطئ، يتحرك القارب إلى الخلف. أيّ قانون يفسّر ذلك؟",["قانون نيوتن الثالث","قانون نيوتن الأول","قانون حفظ الكتلة","قانون أوم"],"دفعتَ القارب إلى الخلف فدفعك إلى الأمام: فعل وردّ فعل."],["كيف يرتفع الصاروخ إلى أعلى؟",["تندفع الغازات إلى الأسفل فتدفع الغازاتُ الصاروخَ إلى الأعلى","يحتكّ بالهواء فيدفعه الاحتكاك إلى الأعلى","تختفي الجاذبية تمامًا عند تشغيل المحرك","يصبح أخفّ من الهواء فيطفو مثل البالون"],"تطبيق للقانون الثالث: الفعل (دفع الغازات) وردّ الفعل (اندفاع الصاروخ)."],["ما الفرق بين الكتلة والوزن؟",["الكتلة كمية المادة، والوزن قوة جذب الأرض للجسم","لا فرق بينهما، فهما اسمان لشيء واحد","الوزن لا يتغيّر من مكان إلى آخر أبدًا","الكتلة قوة تُقاس بالنيوتن والوزن لا يُقاس"],"وزنك على القمر أقل، لكن كتلتك نفسها."],["لماذا تُصنع إطارات السيارات بنقوش بارزة؟",["لزيادة الاحتكاك مع الطريق ومنع الانزلاق","لتقليل الاحتكاك فتسير السيارة أسرع","لتخفيف وزن الإطار وتوفير الوقود","لتجميل الإطار فقط دون فائدة أخرى"],"الاحتكاك المناسب يساعد السيارة على التوقف والتحكم."],["إذا أثّرت قوتان متساويتان ومتعاكستان في جسم ساكن، ماذا يحدث؟",["يبقى ساكنًا لأن القوة المحصّلة صفر","يتحرك في اتجاه القوة الأولى","يتسارع إلى الأعلى بسرعة كبيرة","يتضاعف وزنه بسبب القوتين"],"القوتان المتوازنتان لا تغيّران حركة الجسم."]],"s":"energy"},{"id":"energy","t":"الطاقة وأشكالها وتحوّلاتها","e":"⚡","sum":["الطاقة القدرة على إحداث تغيير أو بذل شغل، وتُقاس بوحدة الجول (J).","طاقة الحركة يمتلكها الجسم المتحرك، وطاقة الوضع (الكامنة) طاقة مخزّنة بسبب موقع الجسم أو حالته.","من أشكال الطاقة: الحرارية، والضوئية، والكهربائية، والكيميائية، والصوتية، والنووية.","قانون حفظ الطاقة: الطاقة لا تفنى ولا تُستحدث، بل تتحوّل من شكل إلى آخر.","مصادر متجدّدة: الشمس والرياح والماء؛ ومصادر غير متجدّدة: النفط والفحم والغاز الطبيعي."],"q":[["ما وحدة قياس الطاقة؟",["الجول","النيوتن","المتر","الكيلوغرام"],"الجول وحدة الطاقة والشغل."],["كرة موضوعة على رفّ عالٍ تمتلك:",["طاقة وضع (كامنة)","طاقة حركة فقط","طاقة صوتية","لا طاقة لها"],"موقعها المرتفع يخزّن طاقة وضع تتحوّل إلى طاقة حركة إذا سقطت."],["ما تحوّلات الطاقة في المصباح الكهربائي؟",["كهربائية ← ضوئية وحرارية","ضوئية ← كهربائية","حرارية ← كيميائية","صوتية ← كهربائية"],"المصباح يحوّل الكهرباء إلى ضوء، ويضيع جزء منها حرارةً."],["ما تحوّل الطاقة في الخلية الشمسية؟",["ضوئية ← كهربائية","كهربائية ← ضوئية","كيميائية ← حرارية","حركية ← صوتية"],"الخلايا الشمسية تحوّل ضوء الشمس إلى كهرباء."],["ما الطاقة المخزّنة في الطعام والوقود والبطارية؟",["طاقة كيميائية","طاقة صوتية","طاقة حركية","طاقة ضوئية"],"تُخزَّن في الروابط الكيميائية وتنطلق بالتفاعلات."],["كرة تسقط من أعلى. ماذا يحدث لطاقتها في أثناء السقوط؟",["تتحوّل طاقة الوضع إلى طاقة حركة","تختفي الطاقة تدريجيًّا","تزداد طاقة الوضع كلما نزلت","تتحوّل إلى طاقة نووية"],"كلما نزلت قلّ ارتفاعها وزادت سرعتها."],["أيّ مصادر الطاقة الآتية متجدّد؟",["الرياح","النفط","الفحم","الغاز الطبيعي"],"الرياح لا تنفد، أما الوقود الأحفوري فينفد."],["ماذا ينصّ قانون حفظ الطاقة؟",["الطاقة لا تفنى ولا تُستحدث بل تتحوّل من شكل إلى آخر","الطاقة تفنى عند استعمالها ولا يبقى منها شيء","الطاقة تُصنع من لا شيء عند الحاجة إليها","الطاقة الحرارية لا تتحوّل إلى أيّ شكل آخر"],"مجموع الطاقة يبقى ثابتًا، لكن شكلها يتغيّر."],["لماذا تسخن يداك عندما تفركهما معًا؟",["تتحوّل طاقة الحركة إلى طاقة حرارية بالاحتكاك","تتحوّل الحرارة إلى طاقة حركة في اليدين","تصدر اليدان ضوءًا يتحوّل إلى حرارة","يتوقف الدم في اليدين فترتفع حرارتهما"],"الاحتكاك يحوّل جزءًا من طاقة الحركة إلى حرارة."],["أيّ الأجسام الآتية له طاقة حركة أكبر إذا تحرّكت كلها بالسرعة نفسها؟",["الشاحنة","الدراجة","الكرة","العصفور"],"طاقة الحركة تزداد بزيادة الكتلة عند السرعة نفسها."]],"s":"energy"},{"id":"electricity","t":"الكهرباء والمغناطيسية","e":"🔋","sum":["التيار الكهربائي سريان الشحنات في مسار مغلق يُسمّى الدائرة الكهربائية.","تحتاج الدائرة إلى مصدر (بطارية)، وأسلاك، وجهاز (مصباح)؛ ولا يمرّ التيار إذا كانت الدائرة مفتوحة.","الموصلات تسمح بمرور الكهرباء (الفلزات)، والعوازل تمنعه (البلاستيك والخشب والمطاط).","في التوصيل على التوالي مسار واحد؛ وفي التوصيل على التوازي عدة مسارات، كما في المنازل.","للمغناطيس قطبان: شمالي وجنوبي؛ الأقطاب المتشابهة تتنافر والمختلفة تتجاذب.","التيار الكهربائي يولّد مجالًا مغناطيسيًّا، وهذه فكرة المغناطيس الكهربائي."],"q":[["متى يضيء المصباح في الدائرة الكهربائية؟",["عندما تكون الدائرة مغلقة","عندما تكون الدائرة مفتوحة","عندما نفصل البطارية","عندما نقطع السلك"],"التيار يحتاج إلى مسار مغلق كامل."],["أيّ المواد الآتية موصل جيد للكهرباء؟",["النحاس","البلاستيك","الخشب الجاف","المطاط"],"الفلزات مثل النحاس موصلات جيدة."],["لماذا تُغطّى الأسلاك الكهربائية بالبلاستيك؟",["لأن البلاستيك عازل يحمينا من الصعق","لأن البلاستيك موصل جيد للكهرباء","لأن البلاستيك يسخّن السلك فيعمل أفضل","لأن البلاستيك يزيد قوة التيار"],"العازل يمنع مرور الكهرباء إلى أجسامنا."],["ما فائدة المفتاح الكهربائي في الدائرة؟",["فتح الدائرة وإغلاقها","زيادة قوة البطارية","تحويل التيار إلى ضوء","تبريد الأسلاك"],"المفتاح يتحكم في مرور التيار."],["في التوصيل على التوالي، إذا احترق أحد المصابيح، ماذا يحدث للبقية؟",["تنطفئ كلها","تبقى مضيئة","يزداد ضوؤها","يضيء واحد منها فقط"],"في التوالي مسار واحد؛ فإذا انقطع انقطع التيار عن الجميع."],["لماذا تُوصل الأجهزة في المنازل على التوازي؟",["ليعمل كل جهاز مستقلًّا عن غيره","لتنطفئ كلها معًا","لتقليل عدد الأسلاك فقط","لأن التوازي لا يحتاج إلى مصدر"],"في التوازي لكل جهاز مساره، فإطفاء جهاز لا يطفئ غيره."],["قطبان مغناطيسيان شماليان متقابلان. ماذا يحدث؟",["يتنافران","يتجاذبان","لا يحدث شيء","يتحوّلان إلى قطبين جنوبيين"],"الأقطاب المتشابهة تتنافر."],["أيّ مما يأتي ينجذب إلى المغناطيس؟",["مسمار حديد","قطعة خشب","كوب زجاج","ورقة"],"الحديد مادة مغناطيسية."],["كيف نصنع مغناطيسًا كهربائيًّا؟",["بلفّ سلك حول مسمار حديد وتمرير تيار فيه","بتسخين مسمار حديد على النار مدة طويلة","بتبريد مغناطيس عادي في الثلاجة","بفرك قطعة خشب بقطعة قماش"],"التيار المارّ في الملف يولّد مجالًا مغناطيسيًّا يقوّيه قلب الحديد."],["ما الذي تشير إليه إبرة البوصلة؟",["اتجاه الشمال المغناطيسي","اتجاه الشمس دائمًا","اتجاه الريح","أقرب جبل"],"إبرة البوصلة مغناطيس صغير يتجه مع المجال المغناطيسي للأرض."]],"s":"energy"},{"id":"waves","t":"الموجات: الصوت والضوء","e":"🌈","sum":["الموجة اضطراب ينقل الطاقة من مكان إلى آخر دون أن ينقل المادة.","الصوت موجة تحتاج إلى وسط تنتقل فيه (صلب أو سائل أو غاز)، ولا ينتقل في الفراغ.","سرعة الصوت في الهواء نحو 340 م/ث، وهو أسرع في السوائل والمواد الصلبة.","الضوء ينتقل في الفراغ بسرعة نحو 300,000 كم/ث، وهو أسرع شيء معروف.","الانعكاس: ارتداد الضوء عن سطح كالمرآة. الانكسار: انحراف الضوء عند انتقاله من وسط إلى آخر.","الضوء الأبيض مزيج من ألوان الطيف السبعة، ويتحلّل بالمنشور أو قطرات المطر فيظهر قوس المطر."],"q":[["ماذا تنقل الموجات؟",["الطاقة","المادة","الماء فقط","الهواء فقط"],"الموجة تنقل الطاقة؛ أما جزيئات الوسط فتهتز في مكانها."],["لماذا لا يستطيع روّاد الفضاء التحدث مباشرة في الفضاء الخارجي؟",["لأن الصوت لا ينتقل في الفراغ","لأن الصوت أسرع كثيرًا هناك","لأن ضوء الشمس يمنع الصوت","لأنهم بعيدون جدًّا عن الأرض"],"الصوت يحتاج إلى وسط مادي، والفضاء شبه فارغ."],["نرى البرق قبل أن نسمع الرعد. لماذا؟",["لأن الضوء أسرع كثيرًا من الصوت","لأن الصوت أسرع من الضوء","لأن الرعد يحدث بعد البرق بساعة","لأن أعيننا أقوى من آذاننا"],"الضوء يصل في لحظة، أما الصوت فيقطع نحو 340 مترًا في الثانية."],["في أيّ وسط ينتقل الصوت أسرع؟",["الحديد","الهواء","الفراغ","لا يختلف"],"ينتقل الصوت أسرع في المواد الصلبة لتقارب جسيماتها."],["ماذا يحدث للضوء عندما يسقط على مرآة؟",["ينعكس","يختفي","يتحوّل إلى صوت","ينكسر دائمًا"],"المرآة سطح أملس لامع يعكس الضوء."],["قلم في كوب ماء يبدو مكسورًا. ما السبب؟",["انكسار الضوء عند انتقاله من الماء إلى الهواء","انعكاس الصوت داخل الماء","أن القلم انكسر فعلًا في الماء","امتصاص الماء للضوء كله فلا نراه"],"الضوء ينحرف عند انتقاله بين وسطين مختلفين."],["كيف يتكوّن قوس المطر؟",["تحلّل ضوء الشمس الأبيض إلى ألوانه في قطرات المطر","انعكاس ضوء القمر عن السحب البيضاء","اختلاط ألوان الأرض والبحر في السماء","احتراق الهواء بعد المطر مباشرة"],"قطرات الماء تعمل عمل المنشور فتفصل الألوان."],["كم تقريبًا سرعة الضوء في الفراغ؟",["300,000 كم/ث","340 م/ث","1,000 كم/ساعة","100 كم/ث"],"الضوء يقطع نحو 300 ألف كيلومتر في الثانية."],["لماذا نرى التفاحة حمراء؟",["لأنها تعكس الضوء الأحمر وتمتصّ بقية الألوان","لأنها تمتصّ الضوء الأحمر وتعكس بقية الألوان","لأنها تصدر ضوءًا أحمر من داخلها","لأن الهواء حولها أحمر اللون"],"لون الجسم هو لون الضوء الذي يعكسه."],["ما الذي يحدّد ارتفاع الصوت (حدّته)؟",["تردّد الموجة","لون مصدر الصوت","وزن المستمع","درجة الإضاءة"],"كلما زاد التردّد كان الصوت أحدّ (أرفع)."]],"s":"energy"},{"id":"heat","t":"الحرارة وانتقالها","e":"🌡️","sum":["الحرارة طاقة تنتقل من الجسم الأسخن إلى الجسم الأبرد.","درجة الحرارة مقياس لمتوسط طاقة حركة الجسيمات، وتُقاس بالترمومتر بوحدة السلسيوس (°س).","التوصيل: انتقال الحرارة بالتلامس، وهو جيد في الفلزات.","الحمل: انتقال الحرارة بحركة الموائع (السوائل والغازات)، فالدافئ يصعد والبارد يهبط.","الإشعاع: انتقال الحرارة على شكل موجات دون حاجة إلى وسط، مثل حرارة الشمس.","الموصلات الحرارية تنقل الحرارة جيدًا، والعوازل تبطئ انتقالها (الخشب، البلاستيك، الصوف، الهواء)."],"q":[["في أيّ اتجاه تنتقل الحرارة؟",["من الجسم الأسخن إلى الأبرد","من الأبرد إلى الأسخن","لا تنتقل","في كل الاتجاهات بالتساوي دائمًا"],"تستمر الحرارة في الانتقال حتى تتساوى درجتا الحرارة."],["ملعقة فلزية في كوب شاي ساخن تسخن يدها. ما طريقة انتقال الحرارة؟",["التوصيل","الحمل","الإشعاع","التكثّف"],"الحرارة انتقلت عبر الملعقة بالتلامس بين جسيماتها."],["كيف تصل حرارة الشمس إلى الأرض؟",["بالإشعاع","بالتوصيل","بالحمل","بالرياح"],"الفضاء بين الشمس والأرض شبه فارغ، والإشعاع لا يحتاج إلى وسط."],["لماذا يُوضع المكيّف في أعلى الغرفة غالبًا؟",["لأن الهواء البارد يهبط فيتوزّع في الغرفة بالحمل","لأن الهواء البارد يصعد فيبقى في الأعلى","لأن الحرارة تنتقل في الغرفة بالتوصيل فقط","لأنه يبدو أجمل في أعلى الجدار فقط"],"الهواء البارد أكثف فيهبط، والدافئ يصعد: هذه تيارات الحمل."],["لماذا تُصنع مقابض القدور من البلاستيك أو الخشب؟",["لأنها عوازل حرارية تحمي اليد","لأنها موصلات جيدة للحرارة","لأنها أثقل فتثبّت القدر","لأنها تسخن بسرعة فتدفئ اليد"],"العوازل تبطئ انتقال الحرارة إلى اليد."],["ما الأداة التي تقيس درجة الحرارة؟",["الترمومتر","الميزان","المسطرة","البوصلة"],"الترمومتر يقيس درجة الحرارة بالسلسيوس غالبًا."],["لماذا نشعر بالدفء عند ارتداء ملابس الصوف في الشتاء؟",["لأن الصوف عازل يحبس الهواء ويقلّل فقدان حرارة الجسم","لأن الصوف يصنع حرارة من تلقاء نفسه","لأن الصوف موصل جيد ينقل حرارة الهواء إلينا","لأن الصوف يمتصّ البرد من الجسم"],"الصوف والهواء المحبوس فيه يبطئان خروج حرارة الجسم."],["ماء يُسخَّن في قِدر: الماء الساخن يصعد والبارد يهبط. ما اسم هذه الطريقة؟",["الحمل","التوصيل","الإشعاع","الانكسار"],"الحمل يحدث في السوائل والغازات."],["ماذا يحدث لمعظم المواد عند تسخينها؟",["تتمدّد","تنكمش","لا تتغيّر","تختفي"],"تتحرك الجسيمات أسرع وتتباعد، فتتمدّد المادة."],["لماذا تُترك فراغات صغيرة بين قطع قضبان السكك الحديدية؟",["لتسمح بتمدّدها في الحرّ","لتقليل وزن السكة","لتصريف مياه المطر فقط","لتجميل شكل السكة"],"الفلزات تتمدّد بالحرارة، والفراغات تمنع انحناء القضبان."]],"s":"energy"},{"id":"layers","t":"تركيب الأرض والصفائح","e":"🌋","sum":["تتكوّن الأرض من طبقات: القشرة (الأرق)، ثم الوشاح، ثم اللب الخارجي السائل، ثم اللب الداخلي الصلب.","الغلاف الصخري (القشرة وأعلى الوشاح) مقسّم إلى صفائح كبيرة تتحرك ببطء شديد.","حركة الصفائح تسبّب الزلازل والبراكين وتكوّن الجبال.","البركان: فتحة تخرج منها الصهارة (الماغما) فتُسمّى على السطح اللابة (الحمم).","تُقاس قوة الزلزال بمقياس ريختر."],"q":[["ما أرقّ طبقات الأرض؟",["القشرة","الوشاح","اللب الخارجي","اللب الداخلي"],"القشرة طبقة رقيقة جدًّا مقارنة بحجم الأرض."],["أيّ طبقات الأرض سائلة؟",["اللب الخارجي","اللب الداخلي","القشرة","الغلاف الصخري"],"اللب الخارجي من حديد ونيكل منصهرين؛ أما اللب الداخلي فصلب بسبب الضغط الهائل."],["ما الترتيب الصحيح لطبقات الأرض من الخارج إلى الداخل؟",["القشرة ← الوشاح ← اللب الخارجي ← اللب الداخلي","الوشاح ← القشرة ← اللب الداخلي ← اللب الخارجي","اللب الداخلي ← اللب الخارجي ← الوشاح ← القشرة","القشرة ← اللب الخارجي ← الوشاح ← اللب الداخلي"],"نبدأ من القشرة على السطح حتى اللب الداخلي في المركز."],["ما الذي يسبّب معظم الزلازل؟",["حركة الصفائح الأرضية","هبوب الرياح القوية","المدّ والجزر في البحار","دوران القمر حول الأرض"],"تتراكم الطاقة عند حدود الصفائح ثم تنطلق فجأة."],["ماذا تُسمّى الصخور المنصهرة بعد خروجها إلى سطح الأرض؟",["اللابة (الحمم)","الماغما (الصهارة)","الرواسب","المعادن"],"تُسمّى ماغما داخل الأرض، ولابة عند خروجها."],["بماذا تُقاس قوة الزلزال؟",["مقياس ريختر","الترمومتر","البارومتر","البوصلة"],"مقياس ريختر يعبّر عن الطاقة المنطلقة من الزلزال."],["كيف تتكوّن كثير من سلاسل الجبال العالية؟",["بتصادم صفيحتين أرضيتين","بهبوب الرياح","بتراكم الثلوج فقط","بسقوط النيازك"],"عند تصادم الصفائح تنطوي الصخور وترتفع فتتكوّن الجبال."],["ما الوشاح؟",["طبقة سميكة من الصخور الساخنة تحت القشرة","الطبقة الخارجية الرقيقة التي نعيش عليها","مركز الأرض المكوَّن من الحديد الصلب","الغلاف الجوي المحيط بالأرض"],"الوشاح أسمك طبقات الأرض، وصخوره بطيئة الحركة."],["لماذا لا نشعر بحركة الصفائح يوميًّا؟",["لأنها بطيئة جدًّا: بضعة سنتيمترات في السنة","لأنها لا تتحرك أبدًا منذ تكوّن الأرض","لأنها تتحرك في الليل فقط ونحن نائمون","لأنها موجودة تحت البحار فقط"],"سرعتها تقارب سرعة نموّ أظفارك."],["أيّ تصرّف صحيح عند حدوث زلزال داخل المبنى؟",["الاحتماء تحت طاولة متينة بعيدًا عن النوافذ","الركض إلى المصعد","الوقوف قرب الزجاج","استعمال الدرج بسرعة في أثناء الاهتزاز"],"الاحتماء يقي من سقوط الأشياء، ولا نستعمل المصعد."]],"s":"earth"},{"id":"rocks","t":"الصخور والمعادن","e":"💎","sum":["المعدن مادة صلبة طبيعية غير عضوية، لها تركيب كيميائي محدّد وبلورات منتظمة، مثل الكوارتز.","من خصائص المعادن: الصلابة، واللون، والبريق، والمخدش.","مقياس موس للصلابة من 1 (التلك) إلى 10 (الألماس).","الصخور ثلاثة أنواع: نارية (من تبرّد الصهارة)، ورسوبية (من تراكم الرواسب)، ومتحوّلة (تغيّرت بالحرارة والضغط).","دورة الصخور: تتحوّل الصخور من نوع إلى آخر عبر ملايين السنين."],"q":[["ما أصلب معدن على مقياس موس؟",["الألماس","التلك","الكوارتز","الجبس"],"الألماس في أعلى المقياس (10)، والتلك في أدناه (1)."],["كيف تتكوّن الصخور النارية؟",["من تبرّد الصهارة وتصلّبها","من تراكم الرواسب","من بقايا النباتات فقط","من تجمّد الماء"],"«نارية» لأنها نشأت من مادة منصهرة."],["كيف تتكوّن الصخور الرسوبية؟",["من تراكم الرواسب وتماسكها في طبقات","من تبرّد الحمم البركانية مباشرة","من الحرارة والضغط الشديدين فقط","من سقوط النيازك على الأرض"],"الرواسب تتراكم طبقات ثم تتماسك عبر الزمن."],["في أيّ نوع من الصخور نجد الأحافير غالبًا؟",["الصخور الرسوبية","الصخور النارية","الصخور المتحوّلة","لا توجد أحافير في الصخور"],"بقايا المخلوقات تُدفن في الرواسب فتحفظها."],["صخر تغيّر بالحرارة والضغط الشديدين دون أن ينصهر. ما نوعه؟",["متحوّل","ناري","رسوبي","معدني"],"الصخور المتحوّلة تتغيّر بنيتها بالحرارة والضغط، مثل تحوّل الحجر الجيري إلى رخام."],["ما «المخدش» في المعدن؟",["لون مسحوقه عند حكّه على لوح خزفي","وزن المعدن مقارنة بحجمه","بريق المعدن تحت الضوء","شكل بلورات المعدن"],"المخدش أدقّ من لون المعدن في التعرّف عليه."],["أيّ مما يأتي معدن؟",["الكوارتز","الخشب","الفحم","العظم"],"الكوارتز معدن طبيعي غير عضوي له بلورات منتظمة."],["الرخام مثال على صخر:",["متحوّل","ناري","رسوبي","بركاني"],"الرخام يتكوّن من تحوّل الحجر الجيري بالحرارة والضغط."],["ما الذي تبيّنه دورة الصخور؟",["أن الصخور تتحوّل من نوع إلى آخر عبر زمن طويل","أن الصخور لا تتغيّر منذ تكوّن الأرض","أن الصخور تنمو وتتكاثر كالنباتات","أن كل الصخور نارية في أصلها ونهايتها"],"يمكن لأيّ نوع من الصخور أن يتحوّل إلى نوع آخر."],["معدن يخدش الزجاج ولا يخدشه الزجاج. ماذا نستنتج؟",["أنه أصلب من الزجاج","أنه أليَن من الزجاج","أنه زجاج","أنه سائل"],"المادة الأصلب تخدش الأليَن."]],"s":"earth"},{"id":"weathering","t":"التجوية والتعرية والتربة","e":"🏜️","sum":["التجوية: تفتّت الصخور وتحلّلها في مكانها بفعل الماء والحرارة والرياح والمخلوقات الحية.","التجوية الميكانيكية تكسّر الصخر دون تغيير مادته، والتجوية الكيميائية تغيّر مادته.","التعرية: نقل الفتات الصخري من مكان إلى آخر بالماء أو الرياح أو الجليد أو الجاذبية.","الترسيب: استقرار المواد المنقولة في مكان جديد.","التربة مزيج من فتات الصخور والمواد العضوية (الدبال) والماء والهواء، وتتكوّن عبر زمن طويل جدًّا."],"q":[["ما الفرق بين التجوية والتعرية؟",["التجوية تفتيت الصخور، والتعرية نقل الفتات","التجوية نقل الفتات، والتعرية تفتيت الصخور","لا فرق بينهما، فهما اسمان لعملية واحدة","كلتاهما بناء للصخور وليس تفتيتًا"],"التجوية تفتّت في المكان، والتعرية تنقل إلى مكان آخر."],["ماء يتجمّد في شقوق صخرة فيوسّعها حتى تتكسّر. ما نوع التجوية؟",["ميكانيكية","كيميائية","حيوية فقط","ليست تجوية"],"الماء يتمدّد عند التجمّد فيكسر الصخر دون تغيير مادته."],["صدأ الصخور الغنية بالحديد مثال على تجوية:",["كيميائية","ميكانيكية","هوائية فقط","حرارية فقط"],"الصدأ تفاعل كيميائي يغيّر مادة الصخر."],["ما العامل الأهمّ في تكوين الكثبان الرملية في الصحراء؟",["الرياح","الأنهار الجليدية","الأمواج","البراكين"],"الرياح تنقل الرمال وترسّبها في كثبان."],["كيف تساعد جذور النباتات على تجوية الصخور؟",["تنمو في الشقوق فتوسّعها","تذيب الصخور كلها","تجمّد الماء","تمنع التجوية تمامًا"],"هذه تجوية بفعل المخلوقات الحية."],["ما الدبال؟",["مواد عضوية متحلّلة من بقايا النباتات والحيوانات","نوع من الصخور النارية الصلبة","رمل خشن تحمله الرياح","ماء مالح يتجمّع في التربة"],"الدبال يجعل التربة خصبة."],["كيف نقلّل تعرية التربة في المزارع؟",["بزراعة النباتات والأشجار لتثبيت التربة","بإزالة كل النباتات من الأرض","بحرث التربة باتجاه المنحدر","بتركها جافة مكشوفة للرياح"],"جذور النباتات تمسك التربة وتحميها من الرياح والماء."],["ماذا يُسمّى استقرار الرواسب في مكان جديد؟",["الترسيب","التجوية","التبخّر","الانصهار"],"بعد النقل (التعرية) يأتي الترسيب."],["لماذا تحتاج التربة الخصبة إلى زمن طويل لتتكوّن؟",["لأن تجوية الصخور وتحلّل المواد العضوية بطيئان جدًّا","لأنها تُصنع في المصانع ببطء ثم تُنقل","لأنها تسقط مع المطر في كميات صغيرة","لأن الصخور لا تتفتّت إلا مرة كل ألف عام"],"قد يحتاج تكوّن طبقة رقيقة من التربة إلى مئات السنين."],["أيّ مما يأتي عامل تعرية؟",["مياه الأنهار الجارية","درجة الحرارة الثابتة","الصخور الساكنة","المعادن"],"الأنهار تحمل الفتات وتنقله إلى أماكن بعيدة."]],"s":"earth"},{"id":"weather","t":"الطقس والمناخ","e":"⛅","sum":["الطقس: حالة الغلاف function stars(){const c=$("#sky");if(!c||matchMedia("(prefers-reduced-motion: reduce)").matches)return;const x=c.getContext("2d"),r=devicePixelRatio||1;c.width=c.offsetWidth*r;c.height=c.offsetHeight*r;
  const pts=Array.from({length:40},()=>({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.3*r,vy:(Math.random()-.5)*.3*r}));
  (function draw(){if(!document.body.contains(c))return;x.clearRect(0,0,c.width,c.height);x.fillStyle="#fff";x.strokeStyle="rgba(255,255,255,.18)";

let Q=null;
function mk(lid,i){const l=LX(lid),[p,o,x]=l.q[i];return {key:lid+"#"+i,lid,p,ans:o[0],opts:sh(o),x}}
function quiz(cfg){
  let list;
  if(cfg.review){list=Object.keys(P.mist).map(k=>{const [lid,i]=k.split("#");return LX(lid)&&LX(lid).q[+i]?mk(lid,+i):null}).filter(Boolean);list=sh(list).slice(0,10)}
  else if(cfg.symbols){list=cfg.list}
  else{const l=LX(cfg.id);list=sh(l.q.map((_,i)=>mk(cfg.id,i)))}
  if(!list.length){show(`<div class="card center"><p>لا توجد أخطاء للمراجعة 🎉</p></div><button class="go" onclick="swap(home)">الرئيسية</button>`);return}
  Q={cfg,list,i:0,score:0};step();
}
function step(){const t=Q.list[Q.i];Q.done=false;
  show(`<div class="qhead"><span>${Q.cfg.review?"📒 مراجعة الأخطاء":Q.cfg.symbols?"🔤 تحدّي الرموز":esc(LX(Q.cfg.id).t)}</span><span>${Q.i+1} / ${Q.list.length}</span></div>
  <div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
  <div class="q">${t.p}</div>
  ${t.opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="pick(${k})">${o}</button>`).join("")}
  <div id="fb"></div>`);
}
function pick(k){if(Q.done)return;Q.done=true;const t=Q.list[Q.i],ok=t.opts[k]===t.ans;
  t.opts.forEach((o,j)=>{const b=$("#o"+j);b.disabled=true;if(o===t.ans)b.classList.add("good");else if(j===k)b.classList.add("bad")});
  if(ok){Q.score++;P.pts+=10;if(t.key)delete P.mist[t.key]}else if(t.key)P.mist[t.key]=Date.now();save();
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"✅ إجابة صحيحة!":"❌ الإجابة الصحيحة: "+t.ans}</b><br>${t.x}</div>
  <button class="go" onclick="next()">${Q.i+1<Q.list.length?"التالي":"النتيجة"}</button>`;
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){Q.i++;if(Q.i<Q.list.length)step();else finish()}
function finish(){const n=Q.list.length,s=Q.score,r=s/n,st=r>=.9?3:r>=.7?2:r>=.5?1:0;
  if(Q.cfg.id){P.stars[Q.cfg.id]=Math.max(P.stars[Q.cfg.id]||0,st);P.pts+=st*10}save();
  show(`<div class="card center"><div class="score">${s} / ${n}</div>${Q.cfg.id?`<div class="stars" style="font-size:30px;margin:0">${starStr(st)}</div>`:""}
  <p>${r>=.9?"ممتاز! أتقنت هذا الدرس 🌟":r>=.7?"عمل جيد! راجع الأخطاء لتصل إلى الإتقان 👍":r>=.5?"بداية طيبة؛ اقرأ «أهم الأفكار» ثم حاول مرة أخرى 💪":"لا بأس؛ اقرأ «أهم الأفكار» بهدوء، ثم أعد المحاولة 🤝"}</p></div>
  <button class="go" onclick="swap(quiz,Q.cfg.symbols?{symbols:true,list:symbolList()}:Q.cfg)">محاولة جديدة</button>
  ${mistN()?`<button class="go alt" onclick="swap(quiz,{review:true})">📒 مراجعة أخطائي (${mistN()})</button>`:""}
  <button class="go alt" onclick="stack=[];swap(home)">الرئيسية</button>`);
}

function canvasLoop(c,h,draw){const r=Math.min(devicePixelRatio||1,2);function size(){c.width=c.clientWidth*r;c.height=h*r;c.style.height=h+"px"}size();
  const ctx=c.getContext("2d");let t0=performance.now();
  (function f(t){if(!document.body.contains(c))return;draw(ctx,c.width,c.height,r,(t-t0)/1000);requestAnimationFrame(f)})(t0);addEventListener("resize",size,{once:true})}
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- توزيع الإلكترونات على المستويات (مبسّط للعناصر 1–36) ---------- */
function shells(z){if(z<=0)return[];if(z<=2)return[z];if(z<=10)return[2,z-2];if(z<=18)return[2,8,z-10];if(z<=20)return[2,8,8,z-18];
  if(z===24)return[2,8,13,1];if(z===29)return[2,8,18,1];if(z<=30)return[2,8,8+(z-20),2];if(z<=36)return[2,8,18,z-28];return null}
function drawAtom(ctx,W,H,r,t,p,n,e,opts){
  const cx=W/2,cy=H/2,dark=matchMedia("(prefers-color-scheme: dark)").matches;
  ctx.clearRect(0,0,W,H);
  const sh=shells(e)||null,maxR=Math.min(W,H)/2-10*r,ns=sh?sh.length:3;
  // المدارات والإلكترونات
  if(sh){sh.forEach((k,i)=>{const R=(i+1)*maxR/(ns+0.4);ctx.strokeStyle=dark?"rgba(180,170,255,.35)":"rgba(91,63,217,.25)";ctx.lineWidth=1.5*r;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
    for(let j=0;j<k;j++){const a=(reduceMotion()?0:t*(1.2-i*.2))+j*2*Math.PI/k;const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
      ctx.fillStyle="#0FB5CE";ctx.beginPath();ctx.arc(x,y,5*r,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.font=`bold ${7*r}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("−",x,y+.5*r)}})}
  else if(e>0){const g=ctx.createRadialGradient(cx,cy,10*r,cx,cy,maxR);g.addColorStop(0,"rgba(15,181,206,.35)");g.addColorStop(1,"rgba(15,181,206,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,maxR,0,7);ctx.fill();
    for(let j=0;j<Math.min(e,60);j++){const a=(reduceMotion()?0:t*.6)+j*2.399,R=maxR*(.3+.7*((j*37)%100)/100);ctx.fillStyle="#0FB5CE";ctx.beginPath();ctx.arc(cx+R*Math.cos(a),cy+R*Math.sin(a),3*r,0,7);ctx.fill()}}
  // النواة
  const tot=p+n,parts=[];for(let i=0;i<tot;i++)parts.push(Math.floor((i+1)*p/tot)>Math.floor(i*p/tot));
  const nr=Math.max(9*r,Math.sqrt(tot)*6*r);
  for(let i=0;i<Math.min(tot,80);i++){const a=i*2.399,d=nr*Math.sqrt(i/Math.max(tot,1))*.9;const x=cx+d*Math.cos(a)+(reduceMotion()?0:Math.sin(t*6+i)*.6*r),y=cy+d*Math.sin(a);
    ctx.fillStyle=parts[i]?"#E5484D":"#8B8FA8";ctx.beginPath();ctx.arc(x,y,6*r,0,7);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.6)";ctx.lineWidth=1*r;ctx.stroke();
    if(parts[i]){ctx.fillStyle="#fff";ctx.font=`bold ${8*r}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("+",x,y+.5*r)}}
}
