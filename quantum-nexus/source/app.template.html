<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة العلوم التفاعلية · Quantum Nexus</title>
<meta name="description" content="أساسيات العلوم للمرحلة المتوسطة: الجدول الدوري التفاعلي ودروس وأسئلة مع التفسير.">
<meta name="theme-color" content="#2B1B6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%232B1B6B'/><g fill='none' stroke='%2367E8F9' stroke-width='3'><ellipse cx='32' cy='32' rx='22' ry='9'/><ellipse cx='32' cy='32' rx='22' ry='9' transform='rotate(60 32 32)'/><ellipse cx='32' cy='32' rx='22' ry='9' transform='rotate(120 32 32)'/></g><circle cx='32' cy='32' r='5' fill='%23FFD566'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#16123A;--ink2:#5B5A7E;--bg:#F3F1FF;--card:#fff;--line:#E0DCF5;--brand:#5B3FD9;--cyan:#0FB5CE;--good:#16A34A;--bad:#E5484D;--gold:#F5B800}
@media (prefers-color-scheme:dark){:root{--ink:#EEEAFF;--ink2:#B3AFD6;--bg:#0D0A24;--card:#1A1540;--line:#2E2860}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:17px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .brand{font-weight:900;font-size:17px;flex:1;display:flex;align-items:center;gap:8px}
.top .brand svg{width:30px;height:30px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
#back{display:none}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px}
.hero{position:relative;overflow:hidden;border-radius:26px;color:#fff;padding:22px 20px;margin:4px 0 18px;background:radial-gradient(110% 120% at 100% 0%,#0FB5CE 0%,rgba(15,181,206,0) 50%),linear-gradient(135deg,#2B1B6B 0%,#4B2BC4 55%,#7A3FE0 100%);box-shadow:0 12px 30px rgba(75,43,196,.35)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hero>*{position:relative}
.kick{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800}
.hero h1{margin:8px 0 2px;font-size:30px;line-height:1.25;font-weight:900}
.hero .en{font-size:15px;font-weight:700;opacity:.85}
.hero p{margin:8px 0 0;font-weight:600;color:rgba(255,255,255,.92)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:6px;text-align:center}
.stats b{display:block;font-size:20px;font-weight:900}.stats small{font-size:12px;font-weight:700;opacity:.9}
h2{font-size:19px;font-weight:900;margin:18px 2px 10px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:16px;border-radius:22px;border:0;color:#fff;background:linear-gradient(135deg,#0FB5CE,#4B2BC4);box-shadow:0 10px 22px rgba(15,181,206,.3)}
.big .ic{font-size:38px;flex:none}.big b{display:block;font-size:20px;font-weight:900}.big small{font-weight:700;opacity:.92}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:720px){.grid2{grid-template-columns:repeat(4,1fr)}}
.strand{display:flex;flex-direction:column;gap:6px;text-align:start;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:0 4px 12px rgba(43,27,107,.07);min-height:130px}
.strand .ic{font-size:30px}.strand b{font-size:16px;font-weight:900;line-height:1.35}.strand small{color:var(--ink2);font-weight:700;font-size:13px}
.strand.soon{opacity:.65;cursor:default}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0FB5CE,#5B3FD9);border-radius:999px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-weight:800;text-align:start}
.tool span{font-size:24px}.tool em{font-style:normal;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-inline-start:auto}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.lesson .ic{font-size:28px;flex:none}.lesson b{display:block;font-size:17px}.lesson small{color:var(--ink2);font-weight:700}
.stars{margin-inline-start:auto;color:var(--gold);font-size:16px;letter-spacing:1px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card ul{margin:0;padding-inline-start:20px}.card li{margin:4px 0}
.go{display:block;width:100%;border:0;border-radius:16px;padding:13px;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(135deg,#5B3FD9,#7A3FE0);box-shadow:0 6px 14px rgba(91,63,217,.3);margin-top:10px}
.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.qhead{display:flex;justify-content:space-between;color:var(--ink2);font-weight:800;font-size:14px;margin-bottom:6px}
.q{font-size:19px;font-weight:800;line-height:1.7;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:start;padding:12px 14px;margin-bottom:10px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:17px}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.fb{border-radius:16px;padding:12px 14px;margin-top:4px;font-weight:600}
.fb.good{background:color-mix(in srgb,var(--good) 12%,var(--card));border:1px solid var(--good)}
.fb.bad{background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid var(--bad)}
.score{font-size:46px;font-weight:900;text-align:center;margin:6px 0}
.center{text-align:center}
.muted{color:var(--ink2)}
.fine{color:var(--ink2);font-size:14px}
/* الجدول الدوري */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.legend button{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;background:var(--card);display:flex;align-items:center;gap:5px}
.legend button i{width:12px;height:12px;border-radius:4px;display:inline-block}
.legend button.on{outline:2px solid var(--brand)}
.search{width:100%;font:inherit;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.ptwrap{overflow-x:auto;padding-bottom:8px;margin:0 -14px;padding-inline:14px;direction:ltr}
.pt{display:grid;grid-template-columns:repeat(18,46px);gap:3px;width:max-content}
.el{width:46px;height:52px;border-radius:8px;border:0;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;color:#14102E;position:relative}
.el .n{font-size:9px;font-weight:700;position:absolute;top:2px;left:4px}
.el .s{font-size:17px;font-weight:900;font-family:system-ui,sans-serif}
.el .a{font-size:8.5px;font-weight:700;max-width:44px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;direction:rtl}
.el.dim{opacity:.18}
.el.gap{background:transparent!important;font-size:10px;color:var(--ink2);font-weight:800}
.c-alkali{background:#FF9AA2}.c-alkaline{background:#FFC48C}.c-trans{background:#FFE08A}.c-post{background:#B5EAD7}.c-metalloid{background:#9DE0E6}.c-nonmetal{background:#A0C4FF}.c-halogen{background:#C3B1FF}.c-noble{background:#FFB3E6}.c-lanth{background:#D4F29A}.c-act{background:#E8C7A0}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,8,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px 26px;max-height:85vh;overflow:auto}
.elhead{display:flex;align-items:center;gap:14px}
.elbig{width:86px;height:96px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#14102E;flex:none}
.elbig .s{font-size:36px;font-weight:900;font-family:system-ui,sans-serif;line-height:1}.elbig .n{font-weight:800}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.facts div{border:1px solid var(--line);border-radius:12px;padding:8px}.facts small{display:block;color:var(--ink2);font-weight:700;font-size:12px}.facts b{font-size:16px}
footer{text-align:center;color:var(--ink2);font-size:13px;margin-top:22px}
footer a{color:inherit}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16123A;color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;z-index:60}
@media (prefers-reduced-motion:reduce){.hero canvas{display:none}}
.ctrl{display:grid;gap:8px;margin-bottom:10px}.ctrl>div{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px}
.ctrl button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;font-weight:900}
.ctrl .cnt{margin-inline-start:auto;font-size:20px;font-weight:900;min-width:28px;text-align:center}
.dot{width:24px;height:24px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.pillx{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;background:var(--card)}.pillx i{width:12px;height:12px;border-radius:4px;display:inline-block}
.seg2{display:flex;gap:8px;margin-bottom:10px}.seg2 button{flex:1;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:14px}
.planets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.planets button{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card);color:var(--ink);font-weight:800;font-size:14px}.planets i{width:12px;height:12px;border-radius:50%}
input[type=range]{accent-color:#5B3FD9;height:32px}
#fs small{font-size:.7em}#fs{padding:4px 10px}.top .brand{white-space:nowrap;min-width:0}
@media (max-width:420px){html[data-font="1"] .bt,html[data-font="2"] .bt{display:none}}
.big.lab{background:linear-gradient(135deg,#0B7285,#5B3FD9);margin-top:12px}
</style>
</head>
<body>
<header class="top">
  <button class="pill" id="back" onclick="back()">رجوع</button>
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#2B1B6B"/><g fill="none" stroke="#67E8F9" stroke-width="3"><ellipse cx="32" cy="32" rx="22" ry="9"/><ellipse cx="32" cy="32" rx="22" ry="9" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="22" ry="9" transform="rotate(120 32 32)"/></g><circle cx="32" cy="32" r="5" fill="#FFD566"/></svg><span class="bt">Quantum Nexus</span></div>
  <button class="pill" id="fs" onclick="fontStep()" aria-label="تكبير الخط أو تصغيره">أ+</button>
  <span class="pill" aria-label="النقاط">⭐ <span id="pts">0</span></span>
</header>
<main id="app"></main>
<script>
const ELEMENTS=__ELEMENTS__;
const LESSONS=__LESSONS__;
const CAT={alkali:"فلزات قلوية",alkaline:"فلزات قلوية أرضية",trans:"فلزات انتقالية",post:"فلزات أخرى",metalloid:"أشباه فلزات",nonmetal:"لافلزات",halogen:"هالوجينات",noble:"غازات نبيلة",lanth:"لانثانيدات",act:"أكتينيدات"};
const STATE={solid:"صلب",liquid:"سائل",gas:"غاز",unknown:"غير معروف (عنصر مُصنَّع)"};
const STRANDS=[
 {id:"matter",t:"المادة والكيمياء",e:"⚗️",d:"الذرة، والجدول الدوري، والتفاعلات",ready:true},
 {id:"life",t:"الحياة",e:"🧬",d:"الخلية، وأجهزة الجسم، والوراثة، والبيئة",ready:true},
 {id:"energy",t:"الطاقة والحركة",e:"⚡",d:"القوى، والطاقة، والكهرباء، والموجات",ready:true},
 {id:"earth",t:"الأرض والفضاء",e:"🌍",d:"الصخور، والطقس، والنظام الشمسي",ready:true}];
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let P;try{P=JSON.parse(localStorage.getItem("qn2")||"{}")}catch(e){P={}}
P.pts=P.pts||0;P.stars=P.stars||{};P.mist=P.mist||{};P.seen=P.seen||{};
const save=()=>{try{localStorage.setItem("qn2",JSON.stringify(P))}catch(e){}$("#pts").textContent=P.pts};
let stack=[],cur=null;
function show(html){$("#app").innerHTML=html;$("#back").style.display=stack.length?"inline-block":"none";$("#pts").textContent=P.pts;scrollTo(0,0);if(cur&&cur.fn===home)stars()}
function go(fn,...a){if(cur)stack.push(cur);cur={fn,a};fn(...a)}
function back(){const p=stack.pop();if(!p)return home();cur=p;p.fn(...p.a)}
function swap(fn,...a){cur={fn,a};fn(...a)}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const starStr=n=>"★".repeat(n)+"☆".repeat(3-n);
const qn=n=>n<=10&&n>=3?n+" أسئلة":n+" سؤالًا";
const FS=[1.12,1.25,1.4],FSN=["عادي","كبير","كبير جدًّا"];
function applyFont(){const h=document.documentElement;h.style.zoom=FS[P.font||0];h.dataset.font=P.font||0}
function fontStep(){P.font=((P.font||0)+1)%FS.length;save();applyFont();toast("حجم الخط: "+FSN[P.font])}
applyFont();
const mistN=()=>Object.keys(P.mist).length;

/* ===== الرئيسية ===== */
function home(){
  const L=LESSONS.length,got=LESSONS.reduce((a,l)=>a+(P.stars[l.id]||0),0),pct=Math.round(got/(L*3)*100);
  const sp=sid=>{const ls=LESSONS.filter(l=>l.s===sid);return ls.length?Math.round(ls.reduce((a,l)=>a+(P.stars[l.id]||0),0)/(ls.length*3)*100):0};
  show(`<section class="hero"><canvas id="sky" aria-hidden="true"></canvas>
    <span class="kick">أساسيات العلوم للمرحلة المتوسطة</span>
    <h1>منصة العلوم التفاعلية</h1><div class="en">Quantum Nexus</div>
    <p>أهم أفكار العلوم في المرحلة المتوسطة، مع جدول دوري تفاعلي وأسئلة لكل منها تفسير.</p>
    <div class="stats"><div><b>118</b><small>عنصرًا</small></div><div><b>${LESSONS.reduce((a,l)=>a+l.q.length,0)}</b><small>سؤالًا</small></div><div><b>${pct}%</b><small>الإنجاز</small></div></div></section>
  <button class="big" onclick="go(table)"><span class="ic">🧪</span><span><b>الجدول الدوري التفاعلي</b><small>العناصر الـ118 كلها: اضغط أيّ عنصر لتعرف عنه</small></span></button>
  <button class="big lab" onclick="go(labs)"><span class="ic">🔭</span><span><b>المختبر التفاعلي</b><small>نماذج حيّة تتحرك: ذرّة تبنيها، وDNA يدور، وكواكب، ودائرة كهربائية</small></span></button>
  <h2>محاور العلوم</h2>
  <div class="grid2">${STRANDS.map(s=>s.ready?`<button class="strand" onclick="go(strand,'${s.id}')"><span class="ic">${s.e}</span><b>${s.t}</b><small>${s.d}</small><small>${LESSONS.filter(l=>l.s===s.id).length} دروس</small><span class="bar"><i style="width:${sp(s.id)}%"></i></span></button>`:`<div class="strand soon" aria-disabled="true"><span class="ic">${s.e}</span><b>${s.t}</b><small>${s.d}</small><small>🛠️ قيد الإعداد</small></div>`).join("")}</div>
  <h2>أدوات</h2>
  <div class="tools"><button class="tool" onclick="go(symbolQuiz)"><span>🔤</span>تحدّي الرموز</button><button class="tool" onclick="go(review)"><span>📒</span>مراجعة أخطائي${mistN()?`<em>${mistN()}</em>`:""}</button></div>
  <footer>أسئلة تدريبية أصلية لأساسيات العلوم، وليست بديلًا عن الكتاب المدرسي أو المعلّم · بلا حساب وبلا إعلانات<br><a href="../">← رحلات تعليمية</a></footer>`);
}
function stars(){const c=$("#sky");if(!c||matchMedia("(prefers-reduced-motion: reduce)").matches)return;const x=c.getContext("2d"),r=devicePixelRatio||1;c.width=c.offsetWidth*r;c.height=c.offsetHeight*r;
  const pts=Array.from({length:40},()=>({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.3*r,vy:(Math.random()-.5)*.3*r}));
  (function draw(){if(!document.body.contains(c))return;x.clearRect(0,0,c.width,c.height);x.fillStyle="#fff";x.strokeStyle="rgba(255,255,255,.18)";
   pts.forEach(p=>{p.x=(p.x+p.vx+c.width)%c.width;p.y=(p.y+p.vy+c.height)%c.height;x.beginPath();x.arc(p.x,p.y,1.6*r,0,7);x.fill()});
   for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<70*r){x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[j].x,pts[j].y);x.stroke()}}
   requestAnimationFrame(draw)})()}

/* ===== المحور والدروس ===== */
function strand(sid){const S=STRANDS.find(s=>s.id===sid),ls=LESSONS.filter(l=>l.s===sid);
  show(`<h1 style="font-size:24px;margin:6px 2px">${S.e} ${S.t}</h1><p class="muted" style="margin:0 2px 12px">${ls.length} دروس. ابدأ بالترتيب، أو اختر ما تحتاج إليه.</p>
  ${ls.map((l,i)=>`<button class="lesson" onclick="go(lesson,'${l.id}')"><span class="ic">${l.e}</span><span><b>${i+1}. ${l.t}</b><small>${qn(l.q.length)}</small></span><span class="stars" aria-label="${P.stars[l.id]||0} من 3 نجوم">${starStr(P.stars[l.id]||0)}</span></button>`).join("")}`);
}
const LX=id=>LESSONS.find(l=>l.id===id);
function lesson(id){const l=LX(id);
  show(`<h1 style="font-size:24px;margin:6px 2px">${l.e} ${l.t}</h1>
  <div class="card"><b>💡 أهم الأفكار</b><ul>${l.sum.map(s=>`<li>${s}</li>`).join("")}</ul></div>
  <button class="go" onclick="swap(quiz,{id:'${id}'})">ابدأ الأسئلة (${l.q.length})</button>
  ${LAB_OF[id]?`<button class="go alt" style="margin-top:10px" onclick="go(lab,'${LAB_OF[id]}')">🔭 جرّب النموذج الحيّ: ${LABS.find(x=>x.id===LAB_OF[id]).t}</button>`:""}
  ${id==="table"?`<button class="go alt" style="margin-top:10px" onclick="go(table)">🧪 افتح الجدول الدوري</button>`:""}`);
}

/* ===== الأسئلة ===== */
let Q=null;
function mk(lid,i){const l=LX(lid),[p,o,x]=l.q[i];return {key:lid+"#"+i,lid,p,ans:o[0],opts:sh(o),x}}
function quiz(cfg){
  let list;
  if(cfg.review){list=Object.keys(P.mist).map(k=>{const [lid,i]=k.split("#");return LX(lid)&&LX(lid).q[+i]?mk(lid,+i):null}).filter(Boolean);list=sh(list).slice(0,10)}
  else if(cfg.symbols){list=cfg.list}
  else{const l=LX(cfg.id);list=sh(l.q.map((_,i)=>mk(cfg.id,i)))}
  if(!list.length){show(`<div class="card center"><p>لا توجد أخطاء للمراجعة 🎉</p></div><button class="go" onclick="swap(home)">الرئيسية</button>`);return}
  Q={cfg,list,i:0,score:0};step();
}
function step(){const t=Q.list[Q.i];Q.done=false;
  show(`<div class="qhead"><span>${Q.cfg.review?"📒 مراجعة الأخطاء":Q.cfg.symbols?"🔤 تحدّي الرموز":esc(LX(Q.cfg.id).t)}</span><span>${Q.i+1} / ${Q.list.length}</span></div>
  <div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
  <div class="q">${t.p}</div>
  ${t.opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="pick(${k})">${o}</button>`).join("")}
  <div id="fb"></div>`);
}
function pick(k){if(Q.done)return;Q.done=true;const t=Q.list[Q.i],ok=t.opts[k]===t.ans;
  t.opts.forEach((o,j)=>{const b=$("#o"+j);b.disabled=true;if(o===t.ans)b.classList.add("good");else if(j===k)b.classList.add("bad")});
  if(ok){Q.score++;P.pts+=10;if(t.key)delete P.mist[t.key]}else if(t.key)P.mist[t.key]=Date.now();save();
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"✅ إجابة صحيحة!":"❌ الإجابة الصحيحة: "+t.ans}</b><br>${t.x}</div>
  <button class="go" onclick="next()">${Q.i+1<Q.list.length?"التالي":"النتيجة"}</button>`;
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){Q.i++;if(Q.i<Q.list.length)step();else finish()}
function finish(){const n=Q.list.length,s=Q.score,r=s/n,st=r>=.9?3:r>=.7?2:r>=.5?1:0;
  if(Q.cfg.id){P.stars[Q.cfg.id]=Math.max(P.stars[Q.cfg.id]||0,st);P.pts+=st*10}save();
  show(`<div class="card center"><div class="score">${s} / ${n}</div>${Q.cfg.id?`<div class="stars" style="font-size:30px;margin:0">${starStr(st)}</div>`:""}
  <p>${r>=.9?"ممتاز! أتقنت هذا الدرس 🌟":r>=.7?"عمل جيد! راجع الأخطاء لتصل إلى الإتقان 👍":r>=.5?"بداية طيبة؛ اقرأ «أهم الأفكار» ثم حاول مرة أخرى 💪":"لا بأس؛ اقرأ «أهم الأفكار» بهدوء، ثم أعد المحاولة 🤝"}</p></div>
  <button class="go" onclick="swap(quiz,Q.cfg.symbols?{symbols:true,list:symbolList()}:Q.cfg)">محاولة جديدة</button>
  ${mistN()?`<button class="go alt" onclick="swap(quiz,{review:true})">📒 مراجعة أخطائي (${mistN()})</button>`:""}
  <button class="go alt" onclick="stack=[];swap(home)">الرئيسية</button>`);
}

function canvasLoop(c,h,draw){const r=Math.min(devicePixelRatio||1,2);function size(){c.width=c.clientWidth*r;c.height=h*r;c.style.height=h+"px"}size();
  const ctx=c.getContext("2d");let t0=performance.now();
  (function f(t){if(!document.body.contains(c))return;draw(ctx,c.width,c.height,r,(t-t0)/1000);requestAnimationFrame(f)})(t0);addEventListener("resize",size,{once:true})}
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- توزيع الإلكترونات على المستويات (مبسّط للعناصر 1–36) ---------- */
function shells(z){if(z<=0)return[];if(z<=2)return[z];if(z<=10)return[2,z-2];if(z<=18)return[2,8,z-10];if(z<=20)return[2,8,8,z-18];
  if(z===24)return[2,8,13,1];if(z===29)return[2,8,18,1];if(z<=30)return[2,8,8+(z-20),2];if(z<=36)return[2,8,18,z-28];return null}
function drawAtom(ctx,W,H,r,t,p,n,e,opts){
  const cx=W/2,cy=H/2,dark=matchMedia("(prefers-color-scheme: dark)").matches;
  ctx.clearRect(0,0,W,H);
  const sh=shells(e)||null,maxR=Math.min(W,H)/2-10*r,ns=sh?sh.length:3;
  // المدارات والإلكترونات
  if(sh){sh.forEach((k,i)=>{const R=(i+1)*maxR/(ns+0.4);ctx.strokeStyle=dark?"rgba(180,170,255,.35)":"rgba(91,63,217,.25)";ctx.lineWidth=1.5*r;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
    for(let j=0;j<k;j++){const a=(reduceMotion()?0:t*(1.2-i*.2))+j*2*Math.PI/k;const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
      ctx.fillStyle="#0FB5CE";ctx.beginPath();ctx.arc(x,y,5*r,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.font=`bold ${7*r}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("−",x,y+.5*r)}})}
  else if(e>0){const g=ctx.createRadialGradient(cx,cy,10*r,cx,cy,maxR);g.addColorStop(0,"rgba(15,181,206,.35)");g.addColorStop(1,"rgba(15,181,206,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,maxR,0,7);ctx.fill();
    for(let j=0;j<Math.min(e,60);j++){const a=(reduceMotion()?0:t*.6)+j*2.399,R=maxR*(.3+.7*((j*37)%100)/100);ctx.fillStyle="#0FB5CE";ctx.beginPath();ctx.arc(cx+R*Math.cos(a),cy+R*Math.sin(a),3*r,0,7);ctx.fill()}}
  // النواة
  const tot=p+n,parts=[];for(let i=0;i<tot;i++)parts.push(Math.floor((i+1)*p/tot)>Math.floor(i*p/tot));
  const nr=Math.max(9*r,Math.sqrt(tot)*6*r);
  for(let i=0;i<Math.min(tot,80);i++){const a=i*2.399,d=nr*Math.sqrt(i/Math.max(tot,1))*.9;const x=cx+d*Math.cos(a)+(reduceMotion()?0:Math.sin(t*6+i)*.6*r),y=cy+d*Math.sin(a);
    ctx.fillStyle=parts[i]?"#E5484D":"#8B8FA8";ctx.beginPath();ctx.arc(x,y,6*r,0,7);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.6)";ctx.lineWidth=1*r;ctx.stroke();
    if(parts[i]){ctx.fillStyle="#fff";ctx.font=`bold ${8*r}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("+",x,y+.5*r)}}
}

/* ---------- DNA ثلاثي الأبعاد ---------- */
function labDNA(){
  show(`<h1 style="font-size:23px;margin:6px 2px">🧬 جزيء DNA</h1>
  <div class="card" style="padding:6px;background:#0D0A24"><canvas id="cv" style="width:100%;display:block;touch-action:none" aria-label="نموذج لولب DNA المزدوج يدور"></canvas></div>
  <div class="legend" style="justify-content:center"><span class="pillx"><i style="background:#FF6B6B"></i>A أدينين</span><span class="pillx"><i style="background:#4D96FF"></i>T ثايمين</span><span class="pillx"><i style="background:#6BCB77"></i>G جوانين</span><span class="pillx"><i style="background:#FFD93D"></i>C سايتوسين</span></div>
  <div class="card"><b>💡 ماذا ترى؟</b><ul><li>DNA سلّم ملتفّ يُسمّى <b>اللولب المزدوج</b>.</li><li>جانبا السلّم من سكّر وفوسفات، والدرجات أزواج من القواعد.</li><li>تقترن القواعد دائمًا هكذا: <b>A مع T</b>، و<b>G مع C</b>.</li><li>ترتيب هذه القواعد هو «التعليمات» الوراثية؛ وكل جين جزء من هذا الترتيب.</li></ul></div>
  <p class="fine">اسحب النموذج يمينًا ويسارًا لتديره.</p>`);
  const seq="ATGCGTACGTTAGCATGCAATCGG".split(""),pair={A:"T",T:"A",G:"C",C:"G"},col={A:"#FF6B6B",T:"#4D96FF",G:"#6BCB77",C:"#FFD93D"};
  let rot=0,drag=null,vel=.6;const c=$("#cv");
  c.onpointerdown=e=>{drag=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag!==null){rot+=(e.clientX-drag)*.012;vel=(e.clientX-drag)*.4;drag=e.clientX}};c.onpointerup=()=>{drag=null};
  canvasLoop(c,340,(ctx,W,H,r,t)=>{ctx.clearRect(0,0,W,H);if(drag===null&&!reduceMotion()){rot+=.012*Math.sign(vel||1)}
    const n=seq.length,top=24*r,step=(H-2*top)/(n-1),R=Math.min(W*.28,90*r),cx=W/2,items=[];
    for(let i=0;i<n;i++){const a=rot+i*.55,y=top+i*step,x1=cx+R*Math.cos(a),z1=Math.sin(a),x2=cx+R*Math.cos(a+Math.PI),z2=Math.sin(a+Math.PI);items.push({i,y,x1,z1,x2,z2,b:seq[i]})}
    items.sort((a,b)=>(a.z1+a.z2)-(b.z1+b.z2));
    // العمودان الفقريان
    [["x1","z1"],["x2","z2"]].forEach(([X,Z])=>{for(let i=0;i<n-1;i++){const A=items.find(o=>o.i===i),B=items.find(o=>o.i===i+1),d=(A[Z]+B[Z])/2;ctx.strokeStyle=`rgba(190,180,255,${.35+.5*(d+1)/2})`;ctx.lineWidth=(3+2*(d+1))*r;ctx.beginPath();ctx.moveTo(A[X],A.y);ctx.lineTo(B[X],B.y);ctx.stroke()}});
    items.forEach(o=>{const d=(o.z1+o.z2)/2,alpha=.45+.55*(d+1)/2,mx=(o.x1+o.x2)/2;ctx.globalAlpha=alpha;ctx.lineWidth=5*r;
      ctx.strokeStyle=col[o.b];ctx.beginPath();ctx.moveTo(o.x1,o.y);ctx.lineTo(mx,o.y);ctx.stroke();ctx.strokeStyle=col[pair[o.b]];ctx.beginPath();ctx.moveTo(mx,o.y);ctx.lineTo(o.x2,o.y);ctx.stroke();
      [[o.x1,o.z1,o.b],[o.x2,o.z2,pair[o.b]]].forEach(([x,z,b])=>{const s=(5+2*(z+1))*r;ctx.fillStyle="#E8E4FF";ctx.beginPath();ctx.arc(x,o.y,s,0,7);ctx.fill();if(z>.2){ctx.fillStyle="#2B1B6B";ctx.font=`bold ${9*r}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(b,x,o.y+.5*r)}});ctx.globalAlpha=1});
  });
}

  show(`<h1 style="font-size:23px;margin:6px 2px">🧊 حالات المادة: جسيمات الماء</h1>
  <div class="card" style="padding:8px"><canvas id="cv" style="width:100%;display:block" aria-label="جسيمات الماء تتحرك بحسب درجة الحرارة"></canvas></div>
  <div class="card"><label for="tmp"><b>درجة الحرارة: <span id="tv" dir="ltr"></span></b></label><input id="tmp" type="range" min="-30" max="150" step="1" value="${TEMP}" oninput="TEMP=+this.value;stInfo()" style="width:100%">
  <div id="st" aria-live="polite" style="margin-top:6px"></div></div>
  <p class="fine">عند مستوى سطح البحر: يتجمّد الماء عند 0 °س، ويغلي عند 100 °س.</p>`);
  stInfo();const N=36,P=Array.from({length:N},(_,i)=>({x:0,y:0,vx:Math.random()-.5,vy:Math.random()-.5,i}));let init=false;
  canvasLoop($("#cv"),260,(ctx,W,H,r)=>{const dark=matchMedia("(prefers-color-scheme: dark)").matches;ctx.clearRect(0,0,W,H);const st=TEMP<0?"s":TEMP<100?"l":"g",rad=8*r;
    ctx.strokeStyle=dark?"#4A4380":"#C9C2F0";ctx.lineWidth=2*r;ctx.strokeRect(r,r,W-2*r,H-2*r);
    if(!init){P.forEach(p=>{p.x=W/2;p.y=H/2});init=true}
    const cols=6,gap=rad*2.3,ox=W/2-(cols-1)*gap/2,oy=H-rad*1.6-(Math.ceil(N/cols)-1)*gap;
    const speed=reduceMotion()?0:Math.max(.2,(TEMP+40)/40)*r;
    P.forEach(p=>{if(st==="s"){const tx=ox+(p.i%cols)*gap,ty=oy+Math.floor(p.i/cols)*gap;p.x+=(tx-p.x)*.15;p.y+=(ty-p.y)*.15;p.x+=(Math.random()-.5)*speed*1.2;p.y+=(Math.random()-.5)*speed*1.2}
      else{p.vx+=(Math.random()-.5)*.3*speed;p.vy+=(Math.random()-.5)*.3*speed+(st==="l"?.12*r:0);const m=st==="l"?1.6*speed:4*speed,v=Math.hypot(p.vx,p.vy);if(v>m){p.vx*=m/v;p.vy*=m/v}
        p.x+=p.vx;p.y+=p.vy;const minY=st==="l"?H*.45:rad;if(p.x<rad){p.x=rad;p.vx=Math.abs(p.vx)}if(p.x>W-rad){p.x=W-rad;p.vx=-Math.abs(p.vx)}if(p.y<minY){p.y=minY;p.vy=Math.abs(p.vy)}if(p.y>H-rad){p.y=H-rad;p.vy=-Math.abs(p.vy)}}
      ctx.fillStyle=st==="s"?"#7DD3FC":st==="l"?"#3B82F6":"#A78BFA";ctx.beginPath();ctx.arc(p.x,p.y,rad,0,7);ctx.fill();ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.arc(p.x-rad*.3,p.y-rad*.3,rad*.3,0,7);ctx.fill()});
    if(st==="l"){ctx.fillStyle="rgba(59,130,246,.10)";ctx.fillRect(2*r,H*.45-rad,W-4*r,H*.55)}
  });
}
function stInfo(){const tv=$("#tv");if(!tv)return;tv.textContent=TEMP+" °C";const st=TEMP<0?"s":TEMP<100?"l":"g";
  $("#st").innerHTML=st==="s"?"🧊 <b>صلب (جليد)</b>: الجسيمات متراصّة في نظام ثابت وتهتزّ في أماكنها فقط.":st==="l"?"💧 <b>سائل (ماء)</b>: الجسيمات متقاربة لكنها تنزلق بعضها فوق بعض، فيأخذ الماء شكل الإناء.":"♨️ <b>غاز (بخار)</b>: الجسيمات متباعدة وسريعة جدًّا وتملأ الإناء كله."}

/* ---------- المجموعة الشمسية ---------- */
const PLANETS=[["عطارد","#B7B7B7",.24,"أقرب الكواكب إلى الشمس وأصغرها، ولا غلاف جوي يُذكر له.","صخري"],["الزهرة","#E8C27A",.62,"أشدّ الكواكب حرارة بسبب غلافه الجوي الكثيف من ثاني أكسيد الكربون.","صخري"],["الأرض","#3B82F6",1,"الكوكب الوحيد المعروف بوجود حياة عليه، وفيه ماء سائل.","صخري"],["المريخ","#E5484D",1.88,"الكوكب الأحمر؛ لونه من أكاسيد الحديد في تربته.","صخري"],["المشتري","#D9A066",11.9,"أكبر الكواكب، عملاق غازي فيه البقعة الحمراء العظيمة (عاصفة ضخمة).","غازي"],["زحل","#E9D58B",29.5,"تحيط به حلقات واضحة من الجليد والصخور.","غازي"],["أورانوس","#7FDBDA",84,"يدور وهو مائل على جنبه تقريبًا.","غازي جليدي"],["نبتون","#4D6BFE",165,"أبعد الكواكب عن الشمس، وفيه أسرع الرياح في المجموعة الشمسية.","غازي جليدي"]];
let SPEED=1,SEL=2;
function labSolar(){
  show(`<h1 style="font-size:23px;margin:6px 2px">🪐 المجموعة الشمسية</h1>
  <div class="card" style="padding:6px;background:#05031A"><canvas id="cv" style="width:100%;display:block" aria-label="الكواكب تدور حول الشمس"></canvas></div>
  <div class="seg2">${["⏸️ إيقاف","▶️ عادي","⏩ سريع"].map((l,i)=>`<button onclick="SPEED=${[0,1,4][i]}">${l}</button>`).join("")}</div>
  <div class="planets">${PLANETS.map((p,i)=>`<button onclick="SEL=${i};plInfo()"><i style="background:${p[1]}"></i>${p[0]}</button>`).join("")}</div>
  <div class="card" id="pl" aria-live="polite"></div>
  <p class="fine">الأحجام والمسافات في الرسم غير حقيقية حتى تظهر الكواكب كلها؛ أما سرعات الدوران فبالنسب الصحيحة تقريبًا.</p>`);
  plInfo();let ang=PLANETS.map((_,i)=>i*.8),last=performance.now();
  canvasLoop($("#cv"),320,(ctx,W,H,r)=>{const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;ctx.clearRect(0,0,W,H);const cx=W/2,cy=H/2,maxR=Math.min(W,H)/2-12*r;
    for(let s=0;s<40;s++){ctx.fillStyle="rgba(255,255,255,.5)";ctx.fillRect((s*97)%W,(s*57)%H,1.2*r,1.2*r)}
    const g=ctx.createRadialGradient(cx,cy,2,cx,cy,22*r);g.addColorStop(0,"#FFF6C2");g.addColorStop(.5,"#FFC94D");g.addColorStop(1,"rgba(255,150,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,22*r,0,7);ctx.fill();
    PLANETS.forEach((p,i)=>{const RR=22*r+(i+.6)*(maxR-22*r)/8.2;ctx.strokeStyle=i===SEL?"rgba(255,255,255,.55)":"rgba(255,255,255,.14)";ctx.lineWidth=1*r;ctx.beginPath();ctx.arc(cx,cy,RR,0,7);ctx.stroke();
      if(!reduceMotion())ang[i]+=dt*SPEED*0.9/p[2];const x=cx+RR*Math.cos(ang[i]),y=cy+RR*Math.sin(ang[i]),s=(i===4?7:i===5?6:i>5?5:i===2?4.5:3.8)*r;
      if(i===5){ctx.strokeStyle="rgba(233,213,139,.8)";ctx.lineWidth=1.5*r;ctx.beginPath();ctx.ellipse(x,y,s*1.9,s*.7,.4,0,7);ctx.stroke()}
      ctx.fillStyle=p[1];ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.fill();if(i===SEL){ctx.strokeStyle="#fff";ctx.lineWidth=2*r;ctx.beginPath();ctx.arc(x,y,s+4*r,0,7);ctx.stroke()}});
  });
}
function plInfo(){const p=PLANETS[SEL];$("#pl").innerHTML=`<b style="font-size:20px">${p[0]}</b> <span class="muted">· الكوكب رقم ${SEL+1} من الشمس · ${p[4]}</span><p style="margin:6px 0 0">${p[3]}</p><p class="fine" style="margin:4px 0 0">يكمل دورته حول الشمس في ${p[2]===1?"سنة أرضية واحدة":p[2]<1?"نحو "+Math.round(p[2]*365)+" يومًا":"نحو "+p[2]+" سنة أرضية"}.</p>`}

/* ---------- الدائرة الكهربائية ---------- */
let CIR={closed:false,par:false,broken:false};
function labCircuit(){
  show(`<h1 style="font-size:23px;margin:6px 2px">💡 الدائرة الكهربائية</h1>
  <div class="card" style="padding:8px"><svg id="sv" viewBox="0 0 320 230" style="width:100%;display:block" role="img" aria-label="دائرة كهربائية فيها بطارية ومفتاح ومصباحان"></svg></div>
  <div class="seg2"><button onclick="CIR.closed=!CIR.closed;cirDraw()">🔘 المفتاح</button><button onclick="CIR.par=!CIR.par;cirDraw()">🔀 توالٍ / توازٍ</button><button onclick="CIR.broken=!CIR.broken;cirDraw()">💥 أتلِف مصباحًا</button></div>
  <div class="card" id="ci" aria-live="polite"></div>`);
  cirDraw();
}
function cirDraw(){const C=CIR,on=C.closed,dim=!C.par;
  const lit1=on&&!C.broken,lit2=C.par?on:on&&!C.broken;
  const bulb=(x,y,lit,broken)=>`<g transform="translate(${x},${y})">${lit?`<circle r="${dim?26:34}" fill="#FFD23F" opacity="${dim?.18:.32}"/>`:""}<circle r="18" fill="${lit?(dim?"#FFE58A":"#FFD23F"):"#E6E3F5"}" stroke="#5B5A7E" stroke-width="2"/><path d="M-7 4 Q0 -10 7 4" stroke="${broken?"#E5484D":"#5B5A7E"}" stroke-width="2" fill="none"/>${broken?`<path d="M-10-10 10 10M10-10-10 10" stroke="#E5484D" stroke-width="3"/>`:""}</g>`;
  const w="stroke:#5B5A7E;stroke-width:4;fill:none";
  let s=`<rect x="20" y="95" width="34" height="50" rx="5" fill="#2B1B6B"/><rect x="31" y="88" width="12" height="8" fill="#2B1B6B"/><text x="37" y="113" fill="#fff" font-size="13" text-anchor="middle" font-family="system-ui">+</text><text x="37" y="138" fill="#fff" font-size="15" text-anchor="middle" font-family="system-ui">−</text>
  <path d="M37 88 V30 H130" style="${w}"/>
  <g transform="translate(130,30)"><circle r="5" fill="#5B5A7E"/><line x1="0" y1="0" x2="${on?60:52}" y2="${on?0:-26}" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><circle cx="60" r="5" fill="#5B5A7E"/></g>`;
  let paths=[];
  if(!C.par){s+=`<path d="M190 30 H290 V200 H37 V145" style="${w}"/>`+bulb(165,200,lit1,C.broken)+bulb(240,200,lit2,false);if(on&&!C.broken)paths=["M37 88 V30 H290 V200 H37 Z"]}
  else{s+=`<path d="M190 30 H280 M37 145 V200 H280 M210 30 V200 M280 30 V200" style="${w}"/>`+bulb(210,115,lit1,C.broken)+bulb(280,115,lit2,false);
    if(on){paths=["M37 88 V30 H280 V200 H37 Z"];if(!C.broken)paths.push("M37 88 V30 H210 V200 H37 Z")}}
  if(!reduceMotion())paths.forEach(p=>{for(let k=0;k<3;k++)s+=`<circle r="4" fill="#0FB5CE"><animateMotion dur="3s" begin="${k}s" repeatCount="indefinite" path="${p}"/></circle>`});
  $("#sv").innerHTML=s;
  $("#ci").innerHTML=`<b>${C.par?"توصيل على التوازي":"توصيل على التوالي"} · المفتاح ${on?"مغلق ✅":"مفتوح"}</b><p style="margin:6px 0 0">${!on?"الدائرة مفتوحة، فلا يمرّ تيار ولا يضيء أيّ مصباح.":C.par?(C.broken?"أحد المصباحين تالف، لكن الآخر ما زال يضيء؛ لأن لكل مصباح مساره الخاص. لهذا تُوصل أجهزة المنازل على التوازي.":"لكل مصباح مسار خاص، فيضيء كلاهما بقوة كاملة."):(C.broken?"أتلفنا مصباحًا فانقطع المسار الوحيد، فانطفأ المصباحان معًا.":"مسار واحد يمرّ في المصباحين، فيتقاسمان الطاقة ويضيئان بضوء أخفت.")}</p>`;
}

addEventListener("keydown",e=>{if(e.key==="Escape"){const s=$(".sheet");if(s)s.remove()}});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
swap(home);
